<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Convoyage Ultra">
<meta name="description" content="Tes missions de convoyage Hiflow, DriiveMe, Otoqi et Pop Valet, ton agenda et tes alertes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="stylesheet" href="style.css">
<title>Convoyage Ultra</title>
</head>
<body>
<header class="barre">
  <div><div class="marque" id="marque">Convoyage Ultra</div><div id="sousTitre" class="sous">Missions</div></div>
  <button id="pastille" class="pastille gris" aria-label="État des plateformes : inconnu" hidden></button>
  <button id="styleBtn" class="icone" aria-label="Changer de style" title="Changer de style">🎨</button>
  <button id="policeBtn" class="icone" aria-label="Changer de police" title="Changer de police">Aa</button>
  <button id="actualiser" class="icone" aria-label="Actualiser" hidden>⟳</button>
</header>

<main id="ecran" aria-live="polite"></main>

<nav id="onglets" class="onglets" hidden>
  <button data-onglet="missions" class="actif"><span>🚗</span>Missions</button>
  <button data-onglet="agenda"><span>📅</span>Agenda</button>
  <button data-onglet="planning"><span>🗺️</span>Multi Jours</button>
  <button data-onglet="factures"><span>💶</span>Factures</button>
  <button data-onglet="alertes"><span>🔔</span>Alertes<b id="badge" class="badge" hidden></b></button>
  <button data-onglet="reglages"><span>⚙️</span>Réglages</button>
</nav>

<div id="feuille" class="feuille" hidden role="dialog" aria-modal="true" aria-labelledby="feuilleTitre">
  <div class="feuilleBoite"><button id="fermer" class="icone fermer" aria-label="Fermer">✕</button><div id="feuilleContenu"></div></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="edition.js"></script>
  <script src="plateformes.js"></script>
<script src="config.js"></script>
<script src="calc.js"></script>
<script src="geo.js"></script>
<script src="retours.js"></script>
<script src="agenda.js"></script>
<script src="planning.js"></script>
<script src="filtres.js"></script>
<script src="facturation.js"></script>
<script src="etat.js"></script>
<script src="api.js"></script>
<script src="routes-pricing.js"></script>
<script src="sibra-feed.js?v=283-sibra-gtfs"></script>
<script src="sibra-planner.js"></script>
<script src="regional-routing.js"></script>
<script src="app.js?v=285-light-blue-transport"></script>
<script src="routes-ui.js"></script>
<script src="admin.js"></script>
</body>
</html>
