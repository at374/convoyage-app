<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANEF A1 — laboratoire de vérification</title>
<style>body{font:16px system-ui,sans-serif;max-width:680px;margin:2rem auto;padding:0 1rem;color:#182a44;background:#f5f8fc}main{background:white;padding:1.5rem;border-radius:14px;box-shadow:0 4px 22px #152c4c17}label{display:block;margin:1rem 0;font-weight:700}select,input{display:block;width:100%;box-sizing:border-box;padding:.65rem;margin-top:.3rem;border:1px solid #9aabc4;border-radius:8px}button{background:#1158b0;color:white;border:0;border-radius:8px;padding:.8rem 1rem;font-weight:700;cursor:pointer}.warn{color:#8b3600}.sanef-a1-preview{margin-top:1rem;padding:1rem;border:2px solid #e5a747;border-radius:10px}.sanef-a1-preview strong{color:#004c98}</style></head>
<body><main><h1>SANEF A1 · Vérification manuelle</h1><p class="warn"><strong>Laboratoire expérimental.</strong> Ne pas utiliser les prix modulés pour facturer. Aucune modification des péages de l'application.</p>
<label>Gare de départ<select id="origin"></select></label><label>Gare d'arrivée<select id="destination"></select></label>
<label>Heure locale à la gare (Europe/Paris)<input id="passage" type="datetime-local" step="1" ></label>
<label>Sens de circulation confirmé<select id="direction"><option value="INCONNU">Choisir le sens</option><option value="VERS_PARIS">Vers Paris (confirmé)</option><option value="AUTRE">Autre sens</option></select></label>
<label>Tarif normal classe 1 déjà vérifié (€)<input id="normal" type="number" min="0" step="0.01" placeholder="Ex. 18.50"></label>
<label><input id="confirmed" type="checkbox" style="width:auto;display:inline"> Gare et heure de passage confirmées</label>
<label><input id="holiday" type="checkbox" style="width:auto;display:inline"> Jour férié ou exception de calendrier possible : ne pas proposer de modulation</label>
<button id="show" type="button">Comparer les tarifs à titre indicatif</button><div id="result" aria-live="polite"></div>
<p><small>Les dates de jours fériés non confirmées ne sont pas interprétées. Ce laboratoire est indépendant du calculateur de facturation.</small></p></main>
<script src="sanef-a1-regles-officielles-2026.js"></script><script src="sanef-a1-official-selector.js"></script><script src="sanef-a1-browser-preview.js"></script><script src="sanef-a1-preview-panel.js"></script>
<script>
(async()=>{const response=await fetch('sanef-a1-gare-alias-2026.json');if(!response.ok)throw Error('Gares indisponibles');const aliases=(await response.json()).aliases;const names=Object.keys(aliases);for(const id of ['origin','destination']){const select=document.getElementById(id);for(const name of names){const option=document.createElement('option');option.value=name;option.textContent=name;select.appendChild(option);}select.selectedIndex=-1;}})().catch(()=>{document.getElementById('result').textContent='Impossible de charger les gares.';});
document.getElementById('show').addEventListener('click',async()=>{const output=document.getElementById('result');output.replaceChildren();const euro=Number(document.getElementById('normal').value);if(document.getElementById('normal').value.trim()===''||!Number.isFinite(euro)||euro<0){output.textContent='Saisir le tarif normal vérifié.';return;}const cents=Math.round(euro*100);if(Math.abs(cents/100-euro)>0.00001){output.textContent='Saisir un tarif avec deux décimales maximum.';return;}if(!document.getElementById('origin').value||!document.getElementById('destination').value||!document.getElementById('passage').value){output.textContent='Choisir deux gares et renseigner l’heure réelle de passage.';return;}const request={origine:document.getElementById('origin').value,destination:document.getElementById('destination').value,classe:1,direction:document.getElementById('direction').value,passageLocal:document.getElementById('passage').value.length===16?document.getElementById('passage').value+':00':document.getElementById('passage').value,passageGareConfirme:document.getElementById('confirmed').checked,jourFerie:document.getElementById('holiday').checked};try{await window.CPSanefA1PreviewPanel.show(output,request,cents);}catch(error){output.textContent='Aperçu indisponible — conserver uniquement le tarif normal vérifié.';}});
</script></body></html>
