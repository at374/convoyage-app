name: Test fare source audit
on:
  pull_request:
    paths:
      - 'scripts/audit_gtfs_fare_sources.py'
      - 'scripts/discover_aura_fare_documents.py'
      - 'transport-lemanpass-fares.js'
      - 'transport-aravis-fares.js'
      - 'transport-proximiti-booking.js'
      - 'tests/transport-proximiti-booking.test.cjs'
      - 'transport-x36-fares.js'
      - 'tests/transport-x36-fares.test.cjs'
      - 'data/transport/x36-illico-autocars-reference-2026-11-08.json'
      - 'transport-272-fares.js'
      - 'tests/transport-272-fares.test.cjs'
      - 'tests/transport-reference-integration-safety.test.cjs'
      - 'tests/transport-aravis-fares.test.cjs'
      - 'data/transport/aravis-fare-*.json'
      - 'scripts/extract_aravis_fare_matrix.py'
      - 'tests/transport-lemanpass-fares.test.cjs'
      - 'tests/fixtures/lemanpass-annemasse-geneve-20261106.json'
      - 'tests/test_gtfs_fare_source_audit.py'
      - '.github/workflows/test-fare-source-audit.yml'
permissions:
  contents: read
jobs:
  inspect-fare-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_gtfs_fare_source_audit.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/transport-lemanpass-fares.test.cjs

      - run: python -m py_compile scripts/discover_aura_fare_documents.py
      - run: node --test tests/transport-aravis-fares.test.cjs
      - run: node --test tests/transport-272-fares.test.cjs
      - run: node --test tests/transport-x36-fares.test.cjs
      - run: node --test tests/transport-proximiti-booking.test.cjs
      - run: node --test tests/transport-reference-integration-safety.test.cjs
      - run: python -m py_compile scripts/extract_aravis_fare_matrix.py
