name: Test peages overlay
on:
  push:
    branches: [main, feature/transport-ranking-safe]
    paths:
      - 'peages-overlay.json'
      - 'data/gares-peage-officiel.json'
      - 'tests/peages-candidats-officiels-thouarce-lievinois.test.cjs'
      - 'tests/peages-audit-sanef-470-stations.test.cjs'
      - 'tests/peages-audit-asf-2056-cloture.test.cjs'
      - 'tests/peages-escota-grille-complete-cloture.test.cjs'
      - 'tests/peages-sources-vinci-2026.test.cjs'
      - 'data/peages-sources-vinci-2026.json'
      - 'data/peages-vinci-principales-liaisons-2026.json'
      - 'tests/peages-vinci-principales-liaisons-2026.test.cjs'
      - 'peages-aprr.json'
      - 'sanef-a1-modulation.js'
      - 'data/sanef-a1-modulation-2026-classe1.json'
      - 'tests/sanef-a1-modulation.test.cjs'
      - 'tests/peages-overlay-conflicts.test.js'
      - '.github/workflows/test-peages-overlay.yml'
  pull_request:
    paths:
      - 'peages-overlay.json'
      - 'data/gares-peage-officiel.json'
      - 'tests/peages-candidats-officiels-thouarce-lievinois.test.cjs'
      - 'tests/peages-audit-sanef-470-stations.test.cjs'
      - 'tests/peages-audit-asf-2056-cloture.test.cjs'
      - 'tests/peages-escota-grille-complete-cloture.test.cjs'
      - 'tests/peages-sources-vinci-2026.test.cjs'
      - 'data/peages-sources-vinci-2026.json'
      - 'data/peages-vinci-principales-liaisons-2026.json'
      - 'tests/peages-vinci-principales-liaisons-2026.test.cjs'
      - 'peages-aprr.json'
      - 'sanef-a1-modulation.js'
      - 'data/sanef-a1-modulation-2026-classe1.json'
      - 'tests/sanef-a1-modulation.test.cjs'
      - 'tests/peages-overlay-conflicts.test.js'
      - '.github/workflows/test-peages-overlay.yml'
  workflow_dispatch:
jobs:
  verify-overlay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate toll overlay regression tests
        run: node --test tests/peages-overlay-conflicts.test.js tests/sanef-a1-modulation.test.cjs tests/peages-candidats-officiels-thouarce-lievinois.test.cjs tests/peages-audit-sanef-470-stations.test.cjs tests/peages-audit-asf-2056-cloture.test.cjs tests/peages-escota-grille-complete-cloture.test.cjs tests/peages-sources-vinci-2026.test.cjs tests/peages-vinci-principales-liaisons-2026.test.cjs
