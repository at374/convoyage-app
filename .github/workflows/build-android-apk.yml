name: Construire l'APK Android (TWA) de Convoyage Ultra

# Déclenchement manuel uniquement : ce build consomme des minutes CI et
# produit un APK signé — on ne veut pas qu'il tourne à chaque commit.
on:
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android (cmdline-tools + licences acceptées)
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances Node (bubblewrap)
        run: npm install

      - name: Préconfigurer Bubblewrap (jdk/sdk déjà installés ci-dessus)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Décoder la clé de signature (secret du dépôt)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Générer le projet Android (non interactif)
        run: node generate-twa-project.js

      - name: Construire et signer l'APK
        # bubblewrap build lit les chemins (manifest, sorties) relativement au
        # répertoire courant : on se place donc DANS le projet généré (android/app),
        # là où generate-twa-project.js a déjà écrit twa-manifest.json et
        # manifest-checksum.txt — sans quoi `build` pose des questions interactives.
        working-directory: android/app
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Lus automatiquement par bubblewrap s'ils sont tous les deux définis
          # (voir Build.getPasswords dans @bubblewrap/cli) : aucune invite posée.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx --prefix .. bubblewrap build \
            --signingKeyPath="../android.keystore" \
            --signingKeyAlias="$ANDROID_KEY_ALIAS"

      - name: Rassembler les livrables
        run: |
          mkdir -p ../dist
          cp app/app-release-signed.apk ../dist/convoyage-ultra.apk
          cp app/app-release-bundle.aab ../dist/convoyage-ultra.aab || true
          ls -la ../dist

      - name: Publier l'APK comme artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: convoyage-ultra-android-apk
          path: dist/*
          retention-days: 90
