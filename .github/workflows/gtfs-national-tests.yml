name: Tests collecteur GTFS national
on:
  push:
    branches:
      - feature/transports-aura-suisse
    paths:
      - 'scripts/collect-national-gtfs.cjs'
      - 'tests/collect-national-gtfs.test.cjs'
      - 'tests/transport-gtfs-loader.test.cjs'
      - 'transport-catalogue.js'
      - 'tests/transport-catalogue.test.cjs'
      - 'transport-gtfs-loader.js'
      - 'transport-gtfs-index.js'
      - 'transport-mission-hub.js'
      - 'transport-fares.js'
      - 'tests/transport-fares.test.cjs'
      - 'transport-national-gtfs-journeys.js'
      - 'tests/national-journeys-real-slice.test.cjs'
      - 'tests/transport-mission-hub.test.cjs'
      - 'transport-gtfs-flex-courses.js'
      - 'tests/transport-gtfs-flex-courses.test.cjs'
      - '.github/workflows/gtfs-national-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests du collecteur national
        run: node --test tests/transport-catalogue.test.cjs tests/collect-national-gtfs.test.cjs tests/transport-gtfs-loader.test.cjs tests/transport-mission-hub.test.cjs tests/transport-gtfs-flex-courses.test.cjs tests/national-journeys-real-slice.test.cjs tests/transport-fares.test.cjs
