name: Test TripGo transport evidence
on:
  push:
    branches: [feature/transport-ranking-safe]
    paths: ['transport-tripgo.js', 'transport-blablacar-realtime.js', 'app.js', 'tests/transport-tripgo.test.cjs', 'tests/transport-blablacar-realtime.test.cjs', 'tests/fixtures/blablacar-*.json', 'tests/fixtures/tripgo-*.json', '.github/workflows/test-transport-tripgo.yml']
  pull_request:
    paths: ['transport-tripgo.js', 'transport-blablacar-realtime.js', 'app.js', 'tests/transport-tripgo.test.cjs', 'tests/transport-blablacar-realtime.test.cjs', 'tests/fixtures/blablacar-*.json', 'tests/fixtures/tripgo-*.json', '.github/workflows/test-transport-tripgo.yml']
permissions:
  contents: read
jobs:
  tripgo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check transport-tripgo.js
      - run: node --test tests/transport-tripgo.test.cjs tests/transport-blablacar-realtime.test.cjs
