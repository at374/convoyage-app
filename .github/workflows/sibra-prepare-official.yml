name: Prepare verified official SIBRA daily timetables

on:
  workflow_dispatch:
    inputs:
      first_day:
        description: 'First service day YYYY-MM-DD'
        required: true
        default: '2026-10-28'
      last_day:
        description: 'Last service day YYYY-MM-DD (max 32 days)'
        required: true
        default: '2026-11-03'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned official SIBRA GTFS archive
        env:
          SOURCE_URL: https://static.data.gouv.fr/resources/offre-de-transports-sibra-a-annecy-gtfs/20261001-085638/gtfs-sibra.zip
          EXPECTED_SHA256: ecb4c0627e47818c8fcd0e7590980f5b905f6c95ab3881bfca88f68f54f81c83
        run: |
          python - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          url = os.environ['SOURCE_URL']
          with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'ConvoyageUltra-GTFS-Validator/1.0'}), timeout=90) as response:
              data = response.read(20_000_001)
          if not data or len(data) > 20_000_000:
              raise SystemExit('Invalid GTFS download size')
          actual = hashlib.sha256(data).hexdigest()
          if actual != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'GTFS SHA256 mismatch: {actual}. No timetable generated.')
          Path('gtfs-sibra.zip').write_bytes(data)
          print(f'Official GTFS SHA256 verified: {actual} ({len(data)} bytes)')
          PY
      - name: Generate date-scoped theoretical timetables
        env:
          FIRST_DAY: ${{ inputs.first_day }}
          LAST_DAY: ${{ inputs.last_day }}
        run: |
          python scripts/export_sibra_range.py gtfs-sibra.zip "$FIRST_DAY" "$LAST_DAY" data/sibra
      - name: Upload generated JSON files for review (no automatic deployment)
        uses: actions/upload-artifact@v4
        with:
          name: sibra-theoretical-timetables
          path: data/sibra/sibra-????-??-??.json
          if-no-files-found: error
          retention-days: 14
