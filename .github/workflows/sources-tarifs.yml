name: Sources tarifaires officielles (texte brut)
on:
  workflow_dispatch:
  push:
    branches: [feature/transports-aura-suisse]
    paths: ['scripts/sources_tarifs.py','.github/workflows/sources-tarifs.yml']
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q poppler-utils && pip install -q openpyxl
      - run: python3 scripts/sources_tarifs.py
      - shell: bash
        run: |
          set -euo pipefail
          git add docs/sources-tarifs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sources tarifaires officielles (serveur)'
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 10; done
