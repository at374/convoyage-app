name: Verify official SAPN A131 gaps
on:
  pull_request:
    paths:
      - 'scripts/verify_sapn_a131.py'
      - 'data/tolls/reviewed/sapn-a131-2026.json'
      - 'tests/test_sapn_a131.py'
      - '.github/workflows/verify-sapn-a131.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline source-coordinate tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install PDF text extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify the exact official PDF column
        run: python scripts/verify_sapn_a131.py --source-copy tmp/sapn-2026-source.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sapn-a131-source-proof
          path: |
            tmp/sapn-a131-result.json
            tmp/sapn-2026-source.pdf
          if-no-files-found: ignore
          retention-days: 14
