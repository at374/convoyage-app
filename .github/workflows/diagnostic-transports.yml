            assert.equal(live.blablacarBus.length,1,'Catalogue BlaBlaCar consulté');
            assert.equal(live.flixbus.length,1,'Catalogue FlixBus consulté');
          }).catch(e=>{console.error(e);process.exitCode=1;});

          const mixedNational=nationalOperatorGTFS([{id:'mixed',name:'Horaires nationaux',resources:[
            {id:'bb',name:'BlaBlaCar Bus Europe',format:'GTFS',url:'https://transport.data.gouv.fr/bb.zip'},
            {id:'other',name:'Autre transporteur',format:'GTFS',url:'https://transport.data.gouv.fr/other.zip'}]}]);
          assert.equal(mixedNational.blablacarBus.length,1,'Découverte par titre de ressource');
          assert.equal(mixedNational.blablacarBus[0].id,'bb','Pas de contamination par les autres ressources');
          assert.equal(mixedNational.flixbus.length,0,'Aucun FlixBus inventé');

          for(const operator of ['sncf','blablacarBus','flixbus']){
            assert.equal(national[operator].length,1,'Flux officiel découvert : '+operator);
            assert.equal(national[operator][0].providesLiveFares,false,'Aucun prix commercial supposé : '+operator);
            assert.equal(national[operator][0].timetableOnly,true,'GTFS horaire uniquement : '+operator);
            assert.equal(national[operator][0].requiresServerSideIndex,true,'Indexation serveur pour gros flux : '+operator);
          }

          const {makeProviders}=require('./transport-mission-hub.js');
          const tripgoStub={CPTripGo:{plan:async()=>[],getKey:()=> 'test-key'},CPSwissTransport:{plan:async()=>[]}};
          const providerDefault=makeProviders(tripgoStub,{fetcher:async()=>({})});
          assert.equal(providerDefault.tripgo.enabled(),false,'TripGo désactivé sans accord explicite');
          assert.equal(providerDefault.swiss.enabled({from:{lat:46.2,lon:6.1},to:{lat:46.3,lon:6.2}}),true,'Suisse disponible indépendamment de TripGo');
          const independent=makeProviders({CPTripGo:{plan:async()=>[],getKey:()=>''},CPRegionalRouting:{plan:async()=>({itineraries:[]}),supportsPublic:()=>true},CPSncfFallback:{plan:async()=>({itineraries:[]})}},{fetcher:async()=>({})});
          assert.equal(independent.tripgo.enabled(),false,'TripGo non requis');
          assert.equal(independent.regional.enabled({from:{lat:45.2,lon:5.7},to:{lat:45.1,lon:5.8}}),true,'Mobilites M sans TripGo');
          assert.equal(independent.sncf.enabled({fromName:'Lyon',toName:'Chambery'}),true,'SNCF sans TripGo');
          assert.equal(makeProviders(tripgoStub,{allowTripGo:true,fetcher:async()=>({})}).tripgo.enabled(),true,'TripGo uniquement sur activation explicite');

          const hs={provider:'Cars Région Haute-Savoie',mode:'Bus',kind:'transit',line:'Y81',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(hs)?.amount,1.70,'Haute-Savoie Y81 : 1,70 €');
          for(const line of ['Y03','Y04','Y13','Y82','Y86','Y91','Y94'])
            assert.equal(fareFor({...hs,line})?.amount,1.70,'Haute-Savoie tarif plat '+line);
          for(const line of ['Y02','Y21','Y22','Y51','Y62','Y63','272','274','Y99'])
            assert.equal(fareFor({...hs,line}),null,'Ligne à grille distincte non tarifée arbitrairement '+line);
          assert.equal(fareFor({...hs,provider:'Cars Région Savoie'}),null,'Pas de prix Haute-Savoie en Savoie');
          assert.equal(fareFor({...hs,departure:'2026-02-28T08:00:00+01:00'}),null,'Grille 2026 hors période');
          const startLeg={provider:"Star't Thonon",mode:'Bus',line:'142',departure:'2026-11-16T08:00:00+01:00',from:{name:'Les Arts'},to:{name:'Bons-en-Chablais Mairie'}};
          assert.equal(fareFor(startLeg)?.amount,2.20,'STAR\u2019T A+B avec arrêts GTFS structurés');
          assert.equal(fareFor({...startLeg,to:{name:'Arrêt inconnu'}}),null,'STAR\u2019T : aucune zone supposée');
          const ainStructured={provider:'Cars Région Ain',mode:'Bus',line:'A01',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor({...ainStructured,from:{name:'Beynost'},to:{name:'Meximieux'}}),null,'Ain : exception tarifaire détectée sur arrêt structuré');
          assert.equal(fareFor({...ainStructured,from:'Meximieux',toPoint:{name:'Lyon'}}),null,'Ain : exception tarifaire détectée sur point GPS nommé');


          // Isère : tableau officiel 01/03/2026, aucune zone inventée.
          const isere=require('./transport-isere-zonal-fares.js');
          const zoneEvidence={verified:true,traversedZones:['A','B','C'],source:'https://www.laregionvoustransporte.fr/'};
          const q=zones=>isere.quote({zones,departure:'2026-11-16T08:00:00+01:00',zoneEvidence:{...zoneEvidence,traversedZones:zoneEvidence.traversedZones.slice(0,zones)}});
          assert.deepEqual(isere.FULL.slice(1),[4.30,6.00,7.70,9.40,11.10,12.80]);
          assert.deepEqual(isere.ECO.slice(1),[3.20,4.40,5.60,6.80,8.00,9.20]);
          assert.equal(q(3)?.amount,7.70);
          const zoneMap={stopA:'C',stopB:'B',stopC:'B',stopD:'A'};
          const stopProof=isere.evidenceFromStops({stopIds:['stopA','stopB','stopC','stopD'],stopZones:zoneMap,source:'https://www.laregionvoustransporte.fr/',complete:true});
          assert.deepEqual(stopProof?.traversedZones,['C','B','A'],'Comptage des zones uniques traversées');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',zoneEvidence:stopProof})?.amount,7.70);
          assert.equal(isere.evidenceFromStops({stopIds:['stopA','stopB','stopD'],stopZones:zoneMap,source:'https://www.laregionvoustransporte.fr/'}),null,'Trajet incomplet non certifié');
          assert.equal(isere.evidenceFromStops({stopIds:['stopA','stopUnknown','stopD'],stopZones:zoneMap,source:'https://www.laregionvoustransporte.fr/',complete:true}),null,'Arrêt sans zone : pas de tarif');
          assert.equal(isere.evidenceFromStops({stopIds:['stopA','stopB'],stopZones:zoneMap,source:'non vérifié',complete:true}),null,'Source officielle obligatoire');
          assert.equal(isere.evidenceFromStops({stopIds:['stopA','stopB'],stopZones:zoneMap,source:'https://example.org/pretendue-grille',complete:true}),null,'Une URL arbitraire ne prouve pas les zones');

          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',profile:'eco',zoneEvidence}),null,'Éco interdit sans justificatif');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',profile:'eco',ecoEligible:true,zoneEvidence})?.amount,5.60,'Éco moins de 26 ans confirmé');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',line:'Transaltitude',zoneEvidence}),null,'Transaltitude exclu');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',network:'TER',zoneEvidence}),null,'Ne pas appliquer la grille Cars Isère au TER');

          assert.equal(q(3)?.validityMinutes,120);
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00'}),null,'Zones sans preuve : aucun prix');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',zoneEvidence:{...zoneEvidence,traversedZones:['A','B']}}),null,'Zone intermédiaire manquante');
          assert.equal(isere.quote({zones:3,departure:'2026-02-16T08:00:00+01:00',zoneEvidence}),null,'Date antérieure à la grille');

          // TAM : livret officiel 2026, 1 voyage à 1,10 €, correspondances pendant 1 h.
          const leg = {kind:'transit',mode:'Bus',provider:'TAM Ambérieu-en-Bugey',line:'TAM 2',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(leg)?.amount,1.10,'TAM : livret 2026');
          assert.equal(fareFor({...leg,provider:'Cars Région Ain'})?.amount,2.30,'Cars Ain : tarif propre, pas TAM');
          const ain={...leg,provider:'Cars Région Ain',line:'A20',from:'Belleville',to:'Bourg-en-Bresse'};
          assert.equal(fareFor(ain)?.amount,2.30,'Cars Région Ain : tarif officiel depuis mars 2026');
          assert.equal(fareFor({...ain,departure:'2026-02-28T08:00:00+01:00'}),null,'Ancienne période non couverte');
          assert.equal(fareFor({...ain,line:'A32'}),null,'RUBIS : dérogation non tarifée à 2,30 €');
          assert.equal(fareFor({...ain,from:'Neyron'}),null,'Colibri / billet spécial Neyron');
          assert.equal(fareFor({...ain,to:'Lyon'}),null,'Dérogation TCL');
          assert.equal(fareFor({...ain,to:'Beynost'}),null,'Dérogation Colibri');
          assert.equal(fareFor({...ain,provider:'Cars Région Savoie'}),null,'Pas de tarif Ain appliqué en Savoie');

