name: Diagnostic réel des transports (15 axes AURA–Suisse)
# Interroge les vrais moteurs depuis un serveur GitHub (accès Internet) : API suisse, Mobilités M, SNCF, GTFS officiels, Valhalla.
# TripGo seulement si le secret CP_TRIPGO_KEY est défini. Publie docs/diagnostic-serveur.json sur la branche source.
on:
  workflow_dispatch:
  push:
    branches: [feature/transports-aura-suisse]
    paths:
      - '.github/workflows/diagnostic-transports.yml'
      - 'scripts/diagnostic-transports-reel.cjs'
      - 'transport-tripgo.js'
      - 'transport-mission-hub.js'
      - 'transport-fare-grids.js'
      - 'transport-coverage.js'
      - 'transport-gtfs-agenda.js'
      - 'transport-catalogue.js'
      - 'transport-national-gtfs-journeys.js'
      - 'scripts/build_national_gtfs_aura.py'
      - 'scripts/build_national_from_catalogue.py'
      - 'scripts/test_national_gtfs_aura.py'
      - 'scripts/audit-national-operators.cjs'
permissions:
  contents: write
concurrency:
  group: diagnostic-transports
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Auditer les flux nationaux SNCF BlaBlaCar FlixBus
        continue-on-error: true
        run: node scripts/audit-national-operators.cjs
      - name: Conserver le rapport des flux nationaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-operateurs-nationaux
          path: docs/audit-national-operators.json
          if-no-files-found: warn
          retention-days: 14
      - name: Vérifier le découpage national GTFS côté serveur
        run: |
          python3 -m py_compile scripts/build_national_gtfs_aura.py
          python3 -m py_compile scripts/build_national_from_catalogue.py
          python3 scripts/build_national_from_catalogue.py --help >/dev/null
          python3 scripts/build_national_gtfs_aura.py --help >/dev/null
          python3 scripts/test_national_gtfs_aura.py
      - name: Tester les trajets nationaux GTFS sans prix inventés
        run: |
          node --check transport-national-gtfs-journeys.js
          node <<'NODE'
          const assert=require('node:assert/strict');
          const national=require('./transport-national-gtfs-journeys.js');
          const indexer=require('./transport-gtfs-index.js');
          const files={
            'calendar.txt':'service_id,monday,tuesday,wednesday,thursday,friday,saturday,sunday,start_date,end_date\ns1,1,1,1,1,1,1,1,20260101,20261231\n',
            'stops.txt':'stop_id,stop_name,stop_lat,stop_lon\na,Annecy,45.901,6.121\nb,Lyon,45.761,4.861\n',
            'routes.txt':'route_id,route_short_name,route_type\nr1,TER,2\n',
            'trips.txt':'route_id,service_id,trip_id\nr1,s1,t1\n',
            'stop_times.txt':'trip_id,arrival_time,departure_time,stop_id,stop_sequence\nt1,08:00:00,08:00:00,a,1\nt1,10:00:00,10:00:00,b,2\n'
          };
          const index=indexer.buildIndex(files);
          const args={operator:'sncf',files,index,date:'2026-11-16',from:{lat:45.901,lon:6.121},to:{lat:45.761,lon:4.861}};
          const rows=national.search(args);
          assert.equal(rows.length,1);
          assert.equal(rows[0].tripId,'t1');
          assert.equal(rows[0].priceEUR,null);
          assert.equal(rows[0].serviceConfirmed,false);
          assert.equal(rows[0].walkingRouteConfirmed,false);
          assert.equal(national.search({...args,earliestDeparture:'09:00'}).length,0);
          assert.throws(()=>national.search({...args,operator:'unknown'}));
          assert.throws(()=>national.search({...args,date:'2026-02-30'}),/Invalid GTFS date/);
          assert.throws(()=>national.search({...args,from:{lat:91,lon:6.121}}),/coordinates/);

          national.loadAndSearch({...args,resource:{url:'http://invalid.example/feed.zip'}})
            .then(()=>{throw Error('HTTP must be rejected')},e=>assert.match(e.message,/HTTPS/));
          national.loadAndSearch({...args,resource:{url:'https://example.org/feed.zip'},loadOptions:{maxArchiveBytes:30*1024*1024}})
            .then(()=>{throw Error('Oversized archive must be rejected')},e=>assert.match(e.message,/safe mobile cap/));
          console.log('Trajet national GTFS, fenêtre horaire, prix inconnus et validations OK');
          NODE
      - name: Vérifier la syntaxe et les tarifs locaux
        run: |
          node --check transport-fare-grids.js
          node --check transport-isere-zonal-fares.js
          node --check transport-tripgo.js
          node --check transport-mission-hub.js
          node --check scripts/test-pedestrian-hub.cjs
          node scripts/test-pedestrian-hub.cjs
          node --check scripts/diagnostic-transports-reel.cjs
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const registry = fs.readFileSync('transport-fare-grids.js','utf8');
          assert.equal(registry.split('function fareFor(').length-1,1,'Une seule fonction fareFor');
          assert.equal((registry.match(/CPTransportFareGrids=api/g)||[]).length,1,'Un seul module de tarifs');
          const {fareFor} = require('./transport-fare-grids.js');
          const {nationalOperatorGTFS}=require('./transport-catalogue.js');
          const feedRows=[
            {id:'sncf',name:'Réseau SNCF TGV, Intercités et TER',resources:[{id:'s',format:'GTFS',url:'https://transport.data.gouv.fr/sncf.zip'}]},
            {id:'blabla',name:'Réseau européen BlaBlaCar Bus',resources:[{id:'b',format:'GTFS',url:'https://transport.data.gouv.fr/blabla.zip'}]},
            {id:'flix',name:'Réseau européen FlixBus et FlixTrain',resources:[{id:'f',format:'GTFS',url:'https://transport.data.gouv.fr/flix.zip'}]}
          ];
          const national=nationalOperatorGTFS(feedRows);
          const normalizedCatalogue=require('./transport-catalogue.js').normalize({datasets:[{
            id:'national',title:'Horaires nationaux',resources:[
              {id:'flix-real',title:'FlixBus Europe',format:'GTFS',original_url:'https://example.org/flix.zip'},
              {id:'not-gtfs',title:'FlixBus prix',format:'CSV',original_url:'https://example.org/prix.csv'}
            ]}]});
          const normalizedNational=nationalOperatorGTFS(normalizedCatalogue);
          assert.equal(normalizedNational.flixbus.length,1,'Nom de ressource conservé après normalisation');
          assert.equal(normalizedNational.flixbus[0].id,'flix-real','Ne pas accepter les CSV comme horaires GTFS');

          const {fetchNationalOperatorGTFS}=require('./transport-catalogue.js');
          const fakeFetch=async()=>({ok:true,json:async()=>({datasets:feedRows})});
          fetchNationalOperatorGTFS(fakeFetch).then(live=>{
            assert.equal(live.sncf.length,1,'Catalogue SNCF consulté');
            assert.equal(live.blablacarBus.length,1,'Catalogue BlaBlaCar consulté');
            assert.equal(live.flixbus.length,1,'Catalogue FlixBus consulté');
          }).catch(e=>{console.error(e);process.exitCode=1;});

          const mixedNational=nationalOperatorGTFS([{id:'mixed',name:'Horaires nationaux',resources:[
            {id:'bb',name:'BlaBlaCar Bus Europe',format:'GTFS',url:'https://transport.data.gouv.fr/bb.zip'},
            {id:'other',name:'Autre transporteur',format:'GTFS',url:'https://transport.data.gouv.fr/other.zip'}]}]);
          assert.equal(mixedNational.blablacarBus.length,1,'Découverte par titre de ressource');
          assert.equal(mixedNational.blablacarBus[0].id,'bb','Pas de contamination par les autres ressources');
          assert.equal(mixedNational.flixbus.length,0,'Aucun FlixBus inventé');

          for(const operator of ['sncf','blablacarBus','flixbus']){
            assert.equal(national[operator].length,1,'Flux officiel découvert : '+operator);
            assert.equal(national[operator][0].providesLiveFares,false,'Aucun prix commercial supposé : '+operator);
            assert.equal(national[operator][0].timetableOnly,true,'GTFS horaire uniquement : '+operator);
            assert.equal(national[operator][0].requiresServerSideIndex,true,'Indexation serveur pour gros flux : '+operator);
          }

          const {makeProviders}=require('./transport-mission-hub.js');
          const tripgoStub={CPTripGo:{plan:async()=>[],getKey:()=> 'test-key'},CPSwissTransport:{plan:async()=>[]}};
          const providerDefault=makeProviders(tripgoStub,{fetcher:async()=>({})});
          assert.equal(providerDefault.tripgo.enabled(),false,'TripGo désactivé sans accord explicite');
          assert.equal(providerDefault.swiss.enabled({from:{lat:46.2,lon:6.1},to:{lat:46.3,lon:6.2}}),true,'Suisse disponible indépendamment de TripGo');
          const independent=makeProviders({CPTripGo:{plan:async()=>[],getKey:()=>''},CPRegionalRouting:{plan:async()=>({itineraries:[]}),supportsPublic:()=>true},CPSncfFallback:{plan:async()=>({itineraries:[]})}},{fetcher:async()=>({})});
          assert.equal(independent.tripgo.enabled(),false,'TripGo non requis');
          assert.equal(independent.regional.enabled({from:{lat:45.2,lon:5.7},to:{lat:45.1,lon:5.8}}),true,'Mobilites M sans TripGo');
          assert.equal(independent.sncf.enabled({fromName:'Lyon',toName:'Chambery'}),true,'SNCF sans TripGo');
          assert.equal(makeProviders(tripgoStub,{allowTripGo:true,fetcher:async()=>({})}).tripgo.enabled(),true,'TripGo uniquement sur activation explicite');

          const hs={provider:'Cars Région Haute-Savoie',mode:'Bus',kind:'transit',line:'Y81',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(hs)?.amount,1.70,'Haute-Savoie Y81 : 1,70 €');
          for(const line of ['Y03','Y04','Y13','Y82','Y86','Y91','Y94'])
            assert.equal(fareFor({...hs,line})?.amount,1.70,'Haute-Savoie tarif plat '+line);
          for(const line of ['Y02','Y21','Y22','Y51','Y62','Y63','272','274','Y99'])
            assert.equal(fareFor({...hs,line}),null,'Ligne à grille distincte non tarifée arbitrairement '+line);
          assert.equal(fareFor({...hs,provider:'Cars Région Savoie'}),null,'Pas de prix Haute-Savoie en Savoie');
          assert.equal(fareFor({...hs,departure:'2026-02-28T08:00:00+01:00'}),null,'Grille 2026 hors période');
          const startLeg={provider:"Star't Thonon",mode:'Bus',line:'142',departure:'2026-11-16T08:00:00+01:00',from:{name:'Les Arts'},to:{name:'Bons-en-Chablais Mairie'}};
          assert.equal(fareFor(startLeg)?.amount,2.20,'STAR\u2019T A+B avec arrêts GTFS structurés');
          assert.equal(fareFor({...startLeg,to:{name:'Arrêt inconnu'}}),null,'STAR\u2019T : aucune zone supposée');
          const ainStructured={provider:'Cars Région Ain',mode:'Bus',line:'A01',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor({...ainStructured,from:{name:'Beynost'},to:{name:'Meximieux'}}),null,'Ain : exception tarifaire détectée sur arrêt structuré');
          assert.equal(fareFor({...ainStructured,from:'Meximieux',toPoint:{name:'Lyon'}}),null,'Ain : exception tarifaire détectée sur point GPS nommé');


          // Isère : tableau officiel 01/03/2026, aucune zone inventée.
          const isere=require('./transport-isere-zonal-fares.js');
          const zoneEvidence={verified:true,traversedZones:['A','B','C'],source:'https://www.laregionvoustransporte.fr/'};
          const q=zones=>isere.quote({zones,departure:'2026-11-16T08:00:00+01:00',zoneEvidence:{...zoneEvidence,traversedZones:zoneEvidence.traversedZones.slice(0,zones)}});
          assert.deepEqual(isere.FULL.slice(1),[4.30,6.00,7.70,9.40,11.10,12.80]);
          assert.deepEqual(isere.ECO.slice(1),[3.20,4.40,5.60,6.80,8.00,9.20]);
          assert.equal(q(3)?.amount,7.70);
          const zoneMap={stopA:'C',stopB:'B',stopC:'B',stopD:'A'};
          const stopProof=isere.evidenceFromStops({stopIds:['stopA','stopB','stopC','stopD'],stopZones:zoneMap,source:'https://www.laregionvoustransporte.fr/',complete:true});
          assert.deepEqual(stopProof?.traversedZones,['C','B','A'],'Comptage des zones uniques traversées');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',zoneEvidence:stopProof})?.amount,7.70);
          assert.equal(isere.evidenceFromStops({stopIds:['stopA','stopB','stopD'],stopZones:zoneMap,source:'https://www.laregionvoustransporte.fr/'}),null,'Trajet incomplet non certifié');
          assert.equal(isere.evidenceFromStops({stopIds:['stopA','stopUnknown','stopD'],stopZones:zoneMap,source:'https://www.laregionvoustransporte.fr/',complete:true}),null,'Arrêt sans zone : pas de tarif');
          assert.equal(isere.evidenceFromStops({stopIds:['stopA','stopB'],stopZones:zoneMap,source:'non vérifié',complete:true}),null,'Source officielle obligatoire');
          assert.equal(isere.evidenceFromStops({stopIds:['stopA','stopB'],stopZones:zoneMap,source:'https://example.org/pretendue-grille',complete:true}),null,'Une URL arbitraire ne prouve pas les zones');

          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',profile:'eco',zoneEvidence}),null,'Éco interdit sans justificatif');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',profile:'eco',ecoEligible:true,zoneEvidence})?.amount,5.60,'Éco moins de 26 ans confirmé');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',line:'Transaltitude',zoneEvidence}),null,'Transaltitude exclu');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',network:'TER',zoneEvidence}),null,'Ne pas appliquer la grille Cars Isère au TER');

          assert.equal(q(3)?.validityMinutes,120);
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00'}),null,'Zones sans preuve : aucun prix');
          assert.equal(isere.quote({zones:3,departure:'2026-11-16T08:00:00+01:00',zoneEvidence:{...zoneEvidence,traversedZones:['A','B']}}),null,'Zone intermédiaire manquante');
          assert.equal(isere.quote({zones:3,departure:'2026-02-16T08:00:00+01:00',zoneEvidence}),null,'Date antérieure à la grille');

          // TAM : livret officiel 2026, 1 voyage à 1,10 €, correspondances pendant 1 h.
          const leg = {kind:'transit',mode:'Bus',provider:'TAM Ambérieu-en-Bugey',line:'TAM 2',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(leg)?.amount,1.10,'TAM : livret 2026');
          assert.equal(fareFor({...leg,provider:'Cars Région Ain'})?.amount,2.30,'Cars Ain : tarif propre, pas TAM');
          const ain={...leg,provider:'Cars Région Ain',line:'A20',from:'Belleville',to:'Bourg-en-Bresse'};
          assert.equal(fareFor(ain)?.amount,2.30,'Cars Région Ain : tarif officiel depuis mars 2026');
          assert.equal(fareFor({...ain,departure:'2026-02-28T08:00:00+01:00'}),null,'Ancienne période non couverte');
          assert.equal(fareFor({...ain,line:'A32'}),null,'RUBIS : dérogation non tarifée à 2,30 €');
          assert.equal(fareFor({...ain,from:'Neyron'}),null,'Colibri / billet spécial Neyron');
          assert.equal(fareFor({...ain,to:'Lyon'}),null,'Dérogation TCL');
          assert.equal(fareFor({...ain,to:'Beynost'}),null,'Dérogation Colibri');
          assert.equal(fareFor({...ain,provider:'Cars Région Savoie'}),null,'Pas de tarif Ain appliqué en Savoie');

          const urban = {kind:'transit',mode:'Bus',provider:"Star't Thonon",line:'A',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(urban)?.amount,1.20,'STAR’T ligne urbaine A : zone A');
          assert.equal(fareFor({...urban,line:'142'}),null,'STAR’T ligne 142 : zone non prouvée');
          assert.equal(fareFor({...urban,line:'L'}),null,'STAR’T ligne L : zone non prouvée');
          assert.equal(fareFor({...urban,provider:"J'y bus Rumilly",line:'J4'})?.amount,1.00,'J’ybus : ticket unité confirmé (jybus.fr)');
          assert.equal(fareFor({...urban,provider:'Cars Région Haute-Savoie'}),null,'Ne pas attribuer STAR’T aux Cars Région');
          // L'option carnet Pass Ondéa doit être visible sur les lignes 400–419.
          const hubSource=fs.readFileSync('transport-mission-hub.js','utf8');
          assert.match(hubSource,/Option : carnet de 10 voyages à 14,50 €/);
          assert.match(hubSource,/\^ond\[ée\]a\\b\/i/,'Motif Ondéa correctement échappé');
          assert.match(hubSource,/\(\?:40\\d\|41\\d\)/,'Motif lignes 400–419 correctement échappé');
          // Ondéa 419 : ligne de proximité scolaire, ne jamais y appliquer le M-Ticket urbain.
          const ondea={kind:'transit',mode:'Bus',provider:'Ondéa Aix-les-Bains',line:'419',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(ondea),null,'Ondéa 419 : tarif unitaire non prouvé');
          assert.equal(fareFor({...ondea,line:'400'}),null,'Ondéa 400 : exclusion scolaire');
          assert.equal(fareFor({...ondea,line:'1'})?.amount,1.70,'Ondéa 1 : tarif urbain');
          // Régressions : zones, dates et opérateurs doivent rester strictement contrôlés.
          assert.equal(fareFor({...leg,line:'TAM 1',departure:'2026-12-31T23:00:00+01:00'})?.amount,1.10);
          assert.equal(fareFor({...leg,departure:'2025-12-31T23:00:00+01:00'}),null);
          assert.equal(fareFor({...urban,line:'NL'})?.amount,1.20);
          assert.equal(fareFor({...urban,line:'142',provider:"THONON-LES-BAINS - STAR'T"}),null);
          assert.equal(fareFor({...urban,line:'A',provider:'Cars Région Haute-Savoie'}),null);
          assert.equal(fareFor({...urban,line:'A',departure:'2027-01-01T08:00:00+01:00'}),null);
          assert.equal(fareFor({...urban,line:'A',mode:'Train'}),null);
          assert.equal(fareFor({...urban,line:'A',provider:''}),null);
          assert.equal(fareFor({...urban,line:'A',kind:'walk'}),null);
          const interzone={...urban,line:'142',from:'Les Arts',to:'Mairie'};
          assert.equal(fareFor(interzone)?.amount,2.20,'STAR’T 142 Les Arts → Mairie');
          assert.equal(fareFor({...interzone,line:'L'})?.amount,2.20,'STAR’T L Les Arts → Mairie');
          assert.equal(fareFor({...interzone,to:'Collège F.Mugnier'}),null,'Zone du terminus non confirmée');
          assert.equal(fareFor({...interzone,provider:'But'}),null,'Autre opérateur non assimilé');
          assert.equal(fareFor({...interzone,departure:'2027-01-01T08:00:00+01:00'}),null,'Tarif expiré');
          // Deux grilles concurrentes pour une même portion ne donnent aucun prix.
          const star = require('./transport-fare-grids.js').GRIDS.find(g=>g.network==="STAR'T zone A");
          assert.ok(star,'Grille STAR’T présente');
          assert.equal(fareFor(urban,[star,{...star}]),null);
          // Si un moteur renvoie un prix incomplet, le registre officiel reste consulté.
          const {priceOf}=require('./transport-mission-hub.js');
          const gridFare=require('./transport-fare-grids.js').fareFor;
          const bus={...urban,kind:'transit',fare:{amount:0,currency:'EUR'}};
          const priced=priceOf({walkOnly:false,legs:[bus]},gridFare);
          assert.equal(priced.status,'verified');
          assert.equal(priced.amounts.EUR,1.20);
          assert.equal(priced.legFares.length,1,'Un tarif résolu par portion');
          assert.equal(priced.legFares[0].amount,1.20,'La carte affiche le tarif officiel résolu');
          const withWalk=priceOf({walkOnly:false,legs:[{kind:'walk'},bus]},gridFare);
          assert.equal(withWalk.legFares.length,2,'Marche et bus alignés dans les détails');
          assert.equal(withWalk.legFares[0],null,'Marche sans billet');
          assert.equal(withWalk.legFares[1].amount,1.20,'Billet du bus à la bonne position');
          assert.equal(priceOf({walkOnly:false,legs:[{...bus,provider:'Opérateur inconnu'}]},gridFare).status,'unknown');
          // Une correspondance sur le même réseau pendant la validité ne se repaie pas.
          const first={...urban,kind:'transit',line:'A',departure:'2026-11-16T08:00:00+01:00'};
          const second={...urban,kind:'transit',line:'B',departure:'2026-11-16T08:35:00+01:00'};
          const sameTicket=priceOf({walkOnly:false,legs:[first,second]},gridFare);
          assert.equal(sameTicket.status,'verified');
          assert.equal(sameTicket.amounts.EUR,1.20);
          const later=priceOf({walkOnly:false,legs:[first,{...second,departure:'2026-11-16T09:05:00+01:00'}]},gridFare);
          assert.equal(later.amounts.EUR,2.40,'Nouveau ticket après expiration');
          const mixed=priceOf({walkOnly:false,legs:[first,{...second,provider:'Opérateur inconnu'}]},gridFare);
          assert.equal(mixed.status,'unknown','Un segment inconnu bloque le prix complet');
          assert.equal(mixed.partial,'1,20 €','Montant partiel visible');
          const official={...bus,fare:{amount:1.50,currency:'EUR',source:'billet fournisseur'}};
          assert.equal(priceOf({walkOnly:false,legs:[official]},gridFare).amounts.EUR,1.50);
          console.log('Exclusions, validité et ambiguïtés tarifaires OK');
          NODE
      - name: Vérifier la présence de TripGo
        env:
          CP_TRIPGO_KEY: ${{ secrets.CP_TRIPGO_KEY }}
        run: |
          if [ -n "$CP_TRIPGO_KEY" ]; then
            echo 'TripGo : secret configuré (valeur masquée)'
          else
            echo '::warning::TripGo : CP_TRIPGO_KEY absent ou vide ; diagnostic sans TripGo'
          fi
      - name: Diagnostic réel
        env:
          CP_TRIPGO_KEY: ${{ secrets.CP_TRIPGO_KEY }}
        run: node scripts/diagnostic-transports-reel.cjs
      - name: Contrôler la cohérence des résultats tarifaires
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const report = require('./docs/diagnostic-serveur.json');
          const axes = report.axes;
          const sum = key => axes.reduce((n,a)=>n+a[key],0);
          assert.equal(report.totals.axes,axes.length);
          assert.equal(report.totals.trips,sum('trips'));
          assert.equal(report.totals.priced,sum('priced'));
          assert.equal(report.totals.partialPricedJourneys,sum('partialPricedJourneys'));
          assert.ok(report.totals.priced<=report.totals.trips);
          assert.ok(report.totals.partialPricedJourneys+report.totals.priced<=report.totals.trips);
          for(const axis of axes){
           assert.ok(axis.priced+axis.partialPricedJourneys<=axis.trips,axis.id);
           assert.ok(axis.missingFareSamples&&axis.partialMissingLineSamples,axis.id);
           for(const lines of Object.values(axis.partialMissingLineSamples)){
            assert.ok(lines.length<=5,axis.id);
           }
           for(const samples of Object.values(axis.missingFareSamples)){
            assert.ok(samples.length<=3,axis.id);
           }
          }
          const combined = {};
          for(const a of axes)for(const [operator,n] of Object.entries(a.partialMissingByOperator)){
           combined[operator]=(combined[operator]||0)+n;
          }
          assert.deepEqual(report.totals.partialMissingByOperator,combined);
          console.log('Rapport cohérent : '+report.totals.priced+' trajets tarifés, '+report.totals.partialPricedJourneys+' partiels');
          NODE
      - name: Bilan de couverture
        run: node scripts/bilan-couverture-transports.cjs
      - name: Sauvegarder les rapports comme artefact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-transports-${{ github.run_id }}
          path: |
            docs/diagnostic-serveur.json
            docs/DIAGNOSTIC-SERVEUR.md
            docs/BILAN-COUVERTURE-TRANSPORTS.md
          if-no-files-found: warn
          retention-days: 14
      - name: Publier le rapport
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/diagnostic-serveur.json docs/DIAGNOSTIC-SERVEUR.md docs/BILAN-COUVERTURE-TRANSPORTS.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Diagnostic réel des transports (serveur)'
          # Un diagnostic concurrent peut avoir modifié la branche pendant le calcul.
          # Rebaser le commit de rapport plutôt que forcer ou écraser les changements.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo '::warning::Conflit sur les rapports : artefact conservé, publication Git annulée sans forcer'
              exit 0
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo 'Rapport publié'
              exit 0
            fi
            echo "Nouvelle modification distante ; tentative ${attempt}/3"
          done
          echo '::error::Branche modifiée durant les tentatives ; publication annulée'
          exit 1
