name: Diagnostic réel des transports (15 axes AURA–Suisse)
# Interroge les vrais moteurs depuis un serveur GitHub (accès Internet) : API suisse, Mobilités M, SNCF, GTFS officiels, Valhalla.
# TripGo seulement si le secret CP_TRIPGO_KEY est défini. Publie docs/diagnostic-serveur.json sur la branche source.
on:
  workflow_dispatch:
  push:
    branches: [feature/transports-aura-suisse]
    paths:
      - '.github/workflows/diagnostic-transports.yml'
      - 'scripts/diagnostic-transports-reel.cjs'
      - 'transport-tripgo.js'
      - 'transport-mission-hub.js'
      - 'transport-fare-grids.js'
      - 'transport-coverage.js'
      - 'transport-gtfs-agenda.js'
permissions:
  contents: write
concurrency:
  group: diagnostic-transports
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vérifier la syntaxe et les tarifs locaux
        run: |
          node --check transport-fare-grids.js
          node --check transport-tripgo.js
          node --check scripts/diagnostic-transports-reel.cjs
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {fareFor} = require('./transport-fare-grids.js');
          const leg = {kind:'transit',mode:'Bus',provider:'TAM Ambérieu-en-Bugey',line:'TAM 2',departure:'2026-11-16T08:00:00+01:00'};
          const fare = fareFor(leg);
          assert.equal(fare?.amount,1.10,'TAM 2026 doit être tarifé à 1,10 €');
          assert.equal(fare?.currency,'EUR');
          assert.equal(fareFor({...leg,provider:'Cars Région Ain'}),null,'Ne pas appliquer TAM aux cars Ain');
          assert.equal(fareFor({...leg,departure:'2027-01-01T08:00:00+01:00'}),null,'Ne pas appliquer un tarif expiré');
          const urban = {kind:'transit',mode:'Bus',provider:"Star't Thonon",line:'A',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(urban)?.amount,1.20,'STAR’T ligne urbaine A : zone A');
          assert.equal(fareFor({...urban,line:'142'}),null,'STAR’T ligne 142 : zone non prouvée');
          assert.equal(fareFor({...urban,line:'L'}),null,'STAR’T ligne L : zone non prouvée');
          assert.equal(fareFor({...urban,provider:"J'y bus Rumilly",line:'J4'}),null,'J’ybus : prix 2026 non confirmé');
          assert.equal(fareFor({...urban,provider:'Cars Région Haute-Savoie'}),null,'Ne pas attribuer STAR’T aux Cars Région');
          console.log('Tarifs TAM et STAR’T urbain vérifiés, exclusions et validité OK');
          NODE
      - name: Vérifier la présence de TripGo
        env:
          CP_TRIPGO_KEY: ${{ secrets.CP_TRIPGO_KEY }}
        run: |
          if [ -n "$CP_TRIPGO_KEY" ]; then
            echo 'TripGo : secret configuré (valeur masquée)'
          else
            echo '::warning::TripGo : CP_TRIPGO_KEY absent ou vide ; diagnostic sans TripGo'
          fi
      - name: Diagnostic réel
        env:
          CP_TRIPGO_KEY: ${{ secrets.CP_TRIPGO_KEY }}
        run: node scripts/diagnostic-transports-reel.cjs
      - name: Bilan de couverture
        run: node scripts/bilan-couverture-transports.cjs
      - name: Sauvegarder les rapports comme artefact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-transports-${{ github.run_id }}
          path: |
            docs/diagnostic-serveur.json
            docs/DIAGNOSTIC-SERVEUR.md
            docs/BILAN-COUVERTURE-TRANSPORTS.md
          if-no-files-found: warn
          retention-days: 14
      - name: Publier le rapport
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/diagnostic-serveur.json docs/DIAGNOSTIC-SERVEUR.md docs/BILAN-COUVERTURE-TRANSPORTS.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Diagnostic réel des transports (serveur)'
          # Un diagnostic concurrent peut avoir modifié la branche pendant le calcul.
          # Rebaser le commit de rapport plutôt que forcer ou écraser les changements.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo '::error::Conflit sur les rapports : publication annulée sans forcer'
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo 'Rapport publié'
              exit 0
            fi
            echo "Nouvelle modification distante ; tentative ${attempt}/3"
          done
          echo '::error::Branche modifiée durant les tentatives ; publication annulée'
          exit 1
