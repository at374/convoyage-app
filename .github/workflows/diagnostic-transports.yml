          const {fareFor} = require('./transport-fare-grids.js');
          const {nationalOperatorGTFS}=require('./transport-catalogue.js');
          const feedRows=[
            {id:'sncf',name:'Réseau SNCF TGV, Intercités et TER',resources:[{id:'s',format:'GTFS',url:'https://transport.data.gouv.fr/sncf.zip'}]},
            {id:'blabla',name:'Réseau européen BlaBlaCar Bus',resources:[{id:'b',format:'GTFS',url:'https://transport.data.gouv.fr/blabla.zip'}]},
