          assert.equal(converted[0].legs[0].arrival,'2026-11-17T00:10:00.000Z');
          assert.equal(converted[0].legs[0].fromPoint.lat,45.901);
          assert.ok(converted[0].missing.some(x=>x.includes('non confirmé')));
          const summer=hub.fromNationalGTFS([{...nationalRow,date:'2026-07-16',departure:'08:00',arrival:'10:00'}],'sncf');
          assert.equal(summer[0].legs[0].departure,'2026-07-16T06:00:00.000Z');
