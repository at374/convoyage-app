name: Diagnostic réel des transports (15 axes AURA–Suisse)
# Interroge les vrais moteurs depuis un serveur GitHub (accès Internet) : API suisse, Mobilités M, SNCF, GTFS officiels, Valhalla.
# TripGo seulement si le secret CP_TRIPGO_KEY est défini. Publie docs/diagnostic-serveur.json sur la branche source.
on:
  workflow_dispatch:
  push:
    branches: [feature/transports-aura-suisse]
    paths:
      - '.github/workflows/diagnostic-transports.yml'
      - 'scripts/diagnostic-transports-reel.cjs'
      - 'transport-tripgo.js'
      - 'transport-mission-hub.js'
      - 'transport-fare-grids.js'
      - 'transport-coverage.js'
      - 'transport-gtfs-agenda.js'
permissions:
  contents: write
concurrency:
  group: diagnostic-transports
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vérifier la syntaxe et les tarifs locaux
        run: |
          node --check transport-fare-grids.js
          node --check transport-tripgo.js
          node --check transport-mission-hub.js
          node --check scripts/test-pedestrian-hub.cjs
          node scripts/test-pedestrian-hub.cjs
          node --check scripts/diagnostic-transports-reel.cjs
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const registry = fs.readFileSync('transport-fare-grids.js','utf8');
          assert.equal(registry.split('function fareFor(').length-1,1,'Une seule fonction fareFor');
          assert.equal((registry.match(/CPTransportFareGrids=api/g)||[]).length,1,'Un seul module de tarifs');
          const {fareFor} = require('./transport-fare-grids.js');
          // TAM : livret officiel 2026, 1 voyage à 1,10 €, correspondances pendant 1 h.
          const leg = {kind:'transit',mode:'Bus',provider:'TAM Ambérieu-en-Bugey',line:'TAM 2',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(leg)?.amount,1.10,'TAM : livret 2026');
          assert.equal(fareFor({...leg,provider:'Cars Région Ain'}),null,'Ne pas appliquer TAM aux cars Ain');
          const ain={...leg,provider:'Cars Région Ain',line:'A20',from:'Belleville',to:'Bourg-en-Bresse'};
          assert.equal(fareFor(ain)?.amount,2.30,'Cars Région Ain : tarif officiel depuis mars 2026');
          assert.equal(fareFor({...ain,departure:'2026-02-28T08:00:00+01:00'}),null,'Ancienne période non couverte');
          assert.equal(fareFor({...ain,line:'A32'}),null,'RUBIS : dérogation non tarifée à 2,30 €');
          assert.equal(fareFor({...ain,from:'Neyron'}),null,'Colibri / billet spécial Neyron');
          assert.equal(fareFor({...ain,to:'Lyon'}),null,'Dérogation TCL');
          assert.equal(fareFor({...ain,to:'Beynost'}),null,'Dérogation Colibri');
          assert.equal(fareFor({...ain,provider:'Cars Région Savoie'}),null,'Pas de tarif Ain appliqué en Savoie');

          const urban = {kind:'transit',mode:'Bus',provider:"Star't Thonon",line:'A',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(urban)?.amount,1.20,'STAR’T ligne urbaine A : zone A');
          assert.equal(fareFor({...urban,line:'142'}),null,'STAR’T ligne 142 : zone non prouvée');
          assert.equal(fareFor({...urban,line:'L'}),null,'STAR’T ligne L : zone non prouvée');
          assert.equal(fareFor({...urban,provider:"J'y bus Rumilly",line:'J4'})?.amount,1.00,'J’ybus : ticket unité confirmé (jybus.fr)');
          assert.equal(fareFor({...urban,provider:'Cars Région Haute-Savoie'}),null,'Ne pas attribuer STAR’T aux Cars Région');
          // L'option carnet Pass Ondéa doit être visible sur les lignes 400–419.
          const hubSource=fs.readFileSync('transport-mission-hub.js','utf8');
          assert.match(hubSource,/Option : carnet de 10 voyages à 14,50 €/);
          assert.match(hubSource,/\^ond\[ée\]a\\b\/i/,'Motif Ondéa correctement échappé');
          assert.match(hubSource,/\(\?:40\\d\|41\\d\)/,'Motif lignes 400–419 correctement échappé');
          // Ondéa 419 : ligne de proximité scolaire, ne jamais y appliquer le M-Ticket urbain.
          const ondea={kind:'transit',mode:'Bus',provider:'Ondéa Aix-les-Bains',line:'419',departure:'2026-11-16T08:00:00+01:00'};
          assert.equal(fareFor(ondea),null,'Ondéa 419 : tarif unitaire non prouvé');
          assert.equal(fareFor({...ondea,line:'400'}),null,'Ondéa 400 : exclusion scolaire');
          assert.equal(fareFor({...ondea,line:'1'})?.amount,1.70,'Ondéa 1 : tarif urbain');
          // Régressions : zones, dates et opérateurs doivent rester strictement contrôlés.
          assert.equal(fareFor({...leg,line:'TAM 1',departure:'2026-12-31T23:00:00+01:00'})?.amount,1.10);
          assert.equal(fareFor({...leg,departure:'2025-12-31T23:00:00+01:00'}),null);
          assert.equal(fareFor({...urban,line:'NL'})?.amount,1.20);
          assert.equal(fareFor({...urban,line:'142',provider:"THONON-LES-BAINS - STAR'T"}),null);
          assert.equal(fareFor({...urban,line:'A',provider:'Cars Région Haute-Savoie'}),null);
          assert.equal(fareFor({...urban,line:'A',departure:'2027-01-01T08:00:00+01:00'}),null);
          assert.equal(fareFor({...urban,line:'A',mode:'Train'}),null);
          assert.equal(fareFor({...urban,line:'A',provider:''}),null);
          assert.equal(fareFor({...urban,line:'A',kind:'walk'}),null);
          const interzone={...urban,line:'142',from:'Les Arts',to:'Mairie'};
          assert.equal(fareFor(interzone)?.amount,2.20,'STAR’T 142 Les Arts → Mairie');
          assert.equal(fareFor({...interzone,line:'L'})?.amount,2.20,'STAR’T L Les Arts → Mairie');
          assert.equal(fareFor({...interzone,to:'Collège F.Mugnier'}),null,'Zone du terminus non confirmée');
          assert.equal(fareFor({...interzone,provider:'But'}),null,'Autre opérateur non assimilé');
          assert.equal(fareFor({...interzone,departure:'2027-01-01T08:00:00+01:00'}),null,'Tarif expiré');
          // Deux grilles concurrentes pour une même portion ne donnent aucun prix.
          const star = require('./transport-fare-grids.js').GRIDS.find(g=>g.network==="STAR'T zone A");
          assert.ok(star,'Grille STAR’T présente');
          assert.equal(fareFor(urban,[star,{...star}]),null);
          // Si un moteur renvoie un prix incomplet, le registre officiel reste consulté.
          const {priceOf}=require('./transport-mission-hub.js');
          const gridFare=require('./transport-fare-grids.js').fareFor;
          const bus={...urban,kind:'transit',fare:{amount:0,currency:'EUR'}};
          const priced=priceOf({walkOnly:false,legs:[bus]},gridFare);
          assert.equal(priced.status,'verified');
          assert.equal(priced.amounts.EUR,1.20);
          assert.equal(priced.legFares.length,1,'Un tarif résolu par portion');
          assert.equal(priced.legFares[0].amount,1.20,'La carte affiche le tarif officiel résolu');
          const withWalk=priceOf({walkOnly:false,legs:[{kind:'walk'},bus]},gridFare);
          assert.equal(withWalk.legFares.length,2,'Marche et bus alignés dans les détails');
          assert.equal(withWalk.legFares[0],null,'Marche sans billet');
          assert.equal(withWalk.legFares[1].amount,1.20,'Billet du bus à la bonne position');
          assert.equal(priceOf({walkOnly:false,legs:[{...bus,provider:'Opérateur inconnu'}]},gridFare).status,'unknown');
          // Une correspondance sur le même réseau pendant la validité ne se repaie pas.
          const first={...urban,kind:'transit',line:'A',departure:'2026-11-16T08:00:00+01:00'};
          const second={...urban,kind:'transit',line:'B',departure:'2026-11-16T08:35:00+01:00'};
          const sameTicket=priceOf({walkOnly:false,legs:[first,second]},gridFare);
          assert.equal(sameTicket.status,'verified');
          assert.equal(sameTicket.amounts.EUR,1.20);
          const later=priceOf({walkOnly:false,legs:[first,{...second,departure:'2026-11-16T09:05:00+01:00'}]},gridFare);
          assert.equal(later.amounts.EUR,2.40,'Nouveau ticket après expiration');
          const mixed=priceOf({walkOnly:false,legs:[first,{...second,provider:'Opérateur inconnu'}]},gridFare);
          assert.equal(mixed.status,'unknown','Un segment inconnu bloque le prix complet');
          assert.equal(mixed.partial,'1,20 €','Montant partiel visible');
          const official={...bus,fare:{amount:1.50,currency:'EUR',source:'billet fournisseur'}};
          assert.equal(priceOf({walkOnly:false,legs:[official]},gridFare).amounts.EUR,1.50);
          console.log('Exclusions, validité et ambiguïtés tarifaires OK');
          NODE
      - name: Vérifier la présence de TripGo
        env:
          CP_TRIPGO_KEY: ${{ secrets.CP_TRIPGO_KEY }}
        run: |
          if [ -n "$CP_TRIPGO_KEY" ]; then
            echo 'TripGo : secret configuré (valeur masquée)'
          else
            echo '::warning::TripGo : CP_TRIPGO_KEY absent ou vide ; diagnostic sans TripGo'
          fi
      - name: Diagnostic réel
        env:
          CP_TRIPGO_KEY: ${{ secrets.CP_TRIPGO_KEY }}
        run: node scripts/diagnostic-transports-reel.cjs
      - name: Contrôler la cohérence des résultats tarifaires
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const report = require('./docs/diagnostic-serveur.json');
          const axes = report.axes;
          const sum = key => axes.reduce((n,a)=>n+a[key],0);
          assert.equal(report.totals.axes,axes.length);
          assert.equal(report.totals.trips,sum('trips'));
          assert.equal(report.totals.priced,sum('priced'));
          assert.equal(report.totals.partialPricedJourneys,sum('partialPricedJourneys'));
          assert.ok(report.totals.priced<=report.totals.trips);
          assert.ok(report.totals.partialPricedJourneys+report.totals.priced<=report.totals.trips);
          for(const axis of axes){
           assert.ok(axis.priced+axis.partialPricedJourneys<=axis.trips,axis.id);
           assert.ok(axis.missingFareSamples&&axis.partialMissingLineSamples,axis.id);
           for(const lines of Object.values(axis.partialMissingLineSamples)){
            assert.ok(lines.length<=5,axis.id);
           }
           for(const samples of Object.values(axis.missingFareSamples)){
            assert.ok(samples.length<=3,axis.id);
           }
          }
          const combined = {};
          for(const a of axes)for(const [operator,n] of Object.entries(a.partialMissingByOperator)){
           combined[operator]=(combined[operator]||0)+n;
          }
          assert.deepEqual(report.totals.partialMissingByOperator,combined);
          console.log('Rapport cohérent : '+report.totals.priced+' trajets tarifés, '+report.totals.partialPricedJourneys+' partiels');
          NODE
      - name: Bilan de couverture
        run: node scripts/bilan-couverture-transports.cjs
      - name: Sauvegarder les rapports comme artefact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-transports-${{ github.run_id }}
          path: |
            docs/diagnostic-serveur.json
            docs/DIAGNOSTIC-SERVEUR.md
            docs/BILAN-COUVERTURE-TRANSPORTS.md
          if-no-files-found: warn
          retention-days: 14
      - name: Publier le rapport
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/diagnostic-serveur.json docs/DIAGNOSTIC-SERVEUR.md docs/BILAN-COUVERTURE-TRANSPORTS.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Diagnostic réel des transports (serveur)'
          # Un diagnostic concurrent peut avoir modifié la branche pendant le calcul.
          # Rebaser le commit de rapport plutôt que forcer ou écraser les changements.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo '::error::Conflit sur les rapports : publication annulée sans forcer'
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo 'Rapport publié'
              exit 0
            fi
            echo "Nouvelle modification distante ; tentative ${attempt}/3"
          done
          echo '::error::Branche modifiée durant les tentatives ; publication annulée'
          exit 1
