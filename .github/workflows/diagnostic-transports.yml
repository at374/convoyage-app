name: Diagnostic réel des transports (15 axes AURA–Suisse)
# Interroge les vrais moteurs depuis un serveur GitHub (accès Internet) : API suisse, Mobilités M, SNCF, GTFS officiels, Valhalla.
# TripGo seulement si le secret CP_TRIPGO_KEY est défini. Publie docs/diagnostic-serveur.json sur la branche source.
on:
  workflow_dispatch:
  push:
    branches: [feature/transports-aura-suisse]
    paths:
      - '.github/workflows/diagnostic-transports.yml'
      - 'scripts/diagnostic-transports-reel.cjs'
      - 'transport-tripgo.js'
      - 'transport-mission-hub.js'
      - 'transport-fare-grids.js'
      - 'transport-coverage.js'
      - 'transport-gtfs-agenda.js'
      - 'transport-catalogue.js'
      - 'transport-national-gtfs-journeys.js'
      - 'scripts/build_national_gtfs_aura.py'
      - 'scripts/build_national_from_catalogue.py'
      - 'scripts/test_national_catalogue_builder.py'
      - 'scripts/test_national_gtfs_aura.py'
      - 'scripts/audit-national-operators.cjs'
permissions:
  contents: write
concurrency:
  group: diagnostic-transports
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Auditer les flux nationaux SNCF BlaBlaCar FlixBus
        continue-on-error: true
        run: node scripts/audit-national-operators.cjs
      - name: Conserver le rapport des flux nationaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-operateurs-nationaux
          path: docs/audit-national-operators.json
          if-no-files-found: warn
          retention-days: 14
      - name: Vérifier le découpage national GTFS côté serveur
        run: |
          python3 -m py_compile scripts/build_national_gtfs_aura.py
          python3 -m py_compile scripts/build_national_from_catalogue.py
          python3 scripts/build_national_from_catalogue.py --help >/dev/null
          python3 scripts/test_national_catalogue_builder.py
          python3 scripts/build_national_gtfs_aura.py --help >/dev/null
          python3 scripts/test_national_gtfs_aura.py
      - name: Tester les trajets nationaux GTFS sans prix inventés
        run: |
          node --check transport-national-gtfs-journeys.js
          node <<'NODE'
          const assert=require('node:assert/strict');
          const national=require('./transport-national-gtfs-journeys.js');
          const indexer=require('./transport-gtfs-index.js');
          const files={
            'calendar.txt':'service_id,monday,tuesday,wednesday,thursday,friday,saturday,sunday,start_date,end_date\ns1,1,1,1,1,1,1,1,20260101,20261231\n',
            'stops.txt':'stop_id,stop_name,stop_lat,stop_lon\na,Annecy,45.901,6.121\nb,Lyon,45.761,4.861\n',
            'routes.txt':'route_id,route_short_name,route_type\nr1,TER,2\n',
            'trips.txt':'route_id,service_id,trip_id\nr1,s1,t1\n',
            'stop_times.txt':'trip_id,arrival_time,departure_time,stop_id,stop_sequence\nt1,08:00:00,08:00:00,a,1\nt1,10:00:00,10:00:00,b,2\n'
          };
          const index=indexer.buildIndex(files);
          const args={operator:'sncf',files,index,date:'2026-11-16',from:{lat:45.901,lon:6.121},to:{lat:45.761,lon:4.861}};
          const rows=national.search(args);
          assert.equal(rows.length,1);
          assert.equal(rows[0].tripId,'t1');
          assert.equal(rows[0].priceEUR,null);
          assert.equal(rows[0].serviceConfirmed,false);
          assert.equal(rows[0].walkingRouteConfirmed,false);
          assert.equal(national.search({...args,earliestDeparture:'09:00'}).length,0);
          assert.equal(national.search({...args,latestArrival:'09:59'}).length,0);
          assert.equal(national.search({...args,latestArrival:'10:00'}).length,1);
          assert.equal(national.search({...args,latestArrival:'09:59:59'}).length,0);
          assert.equal(national.search({...args,earliestDeparture:'08:00:01'}).length,0);
          const overnight={...files,'stop_times.txt':'trip_id,arrival_time,departure_time,stop_id,stop_sequence\nt1,24:30:00,24:30:00,a,1\nt1,25:10:00,25:10:00,b,2\n'};
          const overnightIndex=indexer.buildIndex(overnight);
          assert.equal(national.search({...args,files:overnight,index:overnightIndex,earliestDeparture:'24:00',latestArrival:'25:10'}).length,1);
          assert.equal(national.search({...args,files:overnight,index:overnightIndex,latestArrival:'25:09:59'}).length,0);
          assert.throws(()=>national.search({...args,latestArrival:'25:xx'}),/arrival threshold/);
          assert.throws(()=>national.search({...args,operator:'unknown'}));
          assert.throws(()=>national.search({...args,date:'2026-02-30'}),/Invalid GTFS date/);
          assert.throws(()=>national.search({...args,from:{lat:91,lon:6.121}}),/coordinates/);

          national.loadAndSearch({...args,resource:{url:'http://invalid.example/feed.zip'}})
            .then(()=>{throw Error('HTTP must be rejected')},e=>assert.match(e.message,/HTTPS/));
          national.loadAndSearch({...args,resource:{url:'https://example.org/feed.zip'},loadOptions:{maxArchiveBytes:30*1024*1024}})
            .then(()=>{throw Error('Oversized archive must be rejected')},e=>assert.match(e.message,/safe mobile cap/));
          console.log('Trajet national GTFS, fenêtre horaire, prix inconnus et validations OK');
          NODE
      - name: Vérifier les archives nationales publiées et leur accès HTTPS
        run: |
          python3 - <<'PY'
          import io
          import urllib.request
          import zipfile
          from pathlib import Path
          from hashlib import sha256
          base = 'https://raw.githubusercontent.com/at374/convoyage-app/feature/transports-aura-suisse/data/gtfs/'
          for operator in ('sncf', 'blablacarBus', 'flixbus'):
              name = f'national-{operator}-aura.zip'
              local = Path('data/gtfs') / name
              assert local.is_file(), f'Missing published archive {name}'
              with zipfile.ZipFile(local) as z:
                  assert {'stops.txt','routes.txt','trips.txt','stop_times.txt'} <= set(z.namelist()), name
                  assert z.testzip() is None, f'Corrupted local GTFS: {name}'
              with urllib.request.urlopen(urllib.request.Request(base+name, headers={'User-Agent':'ConvoyageUltra-GTFS-CI'}), timeout=30) as response:
                  assert response.status == 200, f'HTTPS status {response.status}: {name}'
                  assert response.headers.get('Access-Control-Allow-Origin') in ('*','https://at374.github.io'), f'No browser CORS: {name}'
                  remote = response.read(20*1024*1024+1)
              assert len(remote) <= 20*1024*1024, f'Mobile archive too large: {name}'
              assert sha256(remote).digest() == sha256(local.read_bytes()).digest(), f'HTTPS archive differs: {name}'
              with zipfile.ZipFile(io.BytesIO(remote)) as z:
                  assert z.testzip() is None, f'Invalid remote GTFS: {name}'
              print(f'OK {operator}: HTTPS 200, CORS, SHA256, ZIP integrity ({len(remote)} bytes)')
          PY
      - name: Tester les trois moteurs GTFS officiels avec chargement et recherche réels
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const national=require('./transport-national-gtfs-journeys.js');
          const base='https://raw.githubusercontent.com/at374/convoyage-app/feature/transports-aura-suisse/data/gtfs/';
          const date=new Date(Date.now()+86400000).toISOString().slice(0,10);
          (async()=>{
            for(const operator of ['sncf','blablacarBus','flixbus']){
              const resource={format:'GTFS',url:base+'national-'+operator+'-aura.zip'};
              const result=await national.loadAndSearch({
                operator,resource,fetcher:fetch,date,
                from:{lat:45.7601,lon:4.8599},to:{lat:45.9012,lon:6.1219},
                radiusMeters:3000,maxResults:30
              });
              assert.ok(result.counts.stops>0,'Empty official stop index '+operator);
              assert.ok(result.counts.routes>0,'Empty official route index '+operator);
              assert.ok(Array.isArray(result.journeys),'No itinerary result list '+operator);
              for(const journey of result.journeys){
                assert.equal(journey.operator,operator);
                assert.equal(journey.priceEUR,null,'Invented commercial ticket price');
                assert.equal(journey.serviceConfirmed,false,'Unconfirmed schedule marked live');
                assert.equal(journey.walkingRouteConfirmed,false,'Unverified walking route');
              }
              console.log('Official national GTFS end-to-end',operator,
                'stops='+result.counts.stops,'journeys='+result.journeys.length);
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Mesurer les trajets réellement trouvés sur les axes AURA
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const loader=require('./transport-gtfs-loader.js');
          const search=require('./transport-national-gtfs-journeys.js').search;
          const points={
            annecy:{lat:45.9012,lon:6.1219},
            lyon:{lat:45.7601,lon:4.8599},
            chambery:{lat:45.5658,lon:5.9204},
            amberieu:{lat:45.9585,lon:5.3577},
            annemasse:{lat:46.1944,lon:6.2378},
            saintJulien:{lat:46.1447,lon:6.0826},
            archamps:{lat:46.1362,lon:6.1328}
          };
          const axes=[['annecy','lyon'],['chambery','lyon'],['amberieu','lyon'],
            ['chambery','saintJulien'],['annecy','annemasse'],['saintJulien','archamps']];
          const date=new Date(Date.now()+86400000).toISOString().slice(0,10);
          (async()=>{
            const report={date,scope:'static national GTFS direct journeys only; no ticket price or live availability',axes:{}};
            for(const operator of ['sncf','blablacarBus','flixbus']){
              const filename='data/gtfs/national-'+operator+'-aura.zip';
              const bytes=fs.readFileSync(filename);
              const fakeFetch=async()=>new Response(bytes,{headers:{'content-type':'application/zip','content-length':String(bytes.length)}});
              const feed=await loader.loadResource({format:'GTFS',url:'https://example.org/'+operator+'.zip'},
                {fetcher:fakeFetch,indexServiceDates:[date],retainSourceTables:false});
              for(const [a,b] of axes){
                const key=a+'-'+b;
                report.axes[key]??={};
                const journeys=search({operator,files:feed.files,index:feed.index,date,
                  from:points[a],to:points[b],radiusMeters:3000,maxResults:100});
                report.axes[key][operator]=journeys.length;
                assert.ok(journeys.every(j=>j.priceEUR===null&&!j.serviceConfirmed));
              }
            }
            fs.mkdirSync('docs',{recursive:true});
            fs.writeFileSync('docs/audit-national-aura-axes.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Auditer les correspondances SNCF des axes sans trajet direct
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const loader=require('./transport-gtfs-loader.js');
          const indexer=require('./transport-gtfs-index.js');
          const date=new Date(Date.now()+86400000).toISOString().slice(0,10);
          const axes=[
            {name:'chambery-saintJulien',from:{lat:45.5658,lon:5.9204},to:{lat:46.1447,lon:6.0826}},
            {name:'saintJulien-archamps',from:{lat:46.1447,lon:6.0826},to:{lat:46.1362,lon:6.1328}}
          ];
          (async()=>{
            const bytes=fs.readFileSync('data/gtfs/national-sncf-aura.zip');
            const feed=await loader.loadResource({format:'GTFS',url:'https://example.org/sncf.zip'},{
              fetcher:async()=>new Response(bytes,{headers:{'content-type':'application/zip','content-length':String(bytes.length)}}),
              indexServiceDates:[date],retainSourceTables:false
            });
            const report={date,operator:'sncf',scope:'one-transfer GTFS candidates only; no verified fares or real-time service',axes:{}};
            for(const axis of axes){
              const result=indexer.nearbyTransferTrips(feed.files,feed.index,date,axis.from,axis.to,3000,
                {maxLegs:15000,maxCandidates:200,maxExaminedPairs:30000,minTransferMinutes:5,maxWaitMinutes:120});
              report.axes[axis.name]={candidates:result.journeys.length,searchTruncated:result.searchTruncated};
              console.log(axis.name,JSON.stringify(report.axes[axis.name]));
            }
            fs.writeFileSync('docs/audit-national-aura-transfers.json',JSON.stringify(report,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Tester les correspondances nationales dans les fiches mission
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const indexer=require('./transport-gtfs-index.js');
          const national=require('./transport-national-gtfs-journeys.js');
          const hub=require('./transport-mission-hub.js');
          const files={
            'stops.txt':'stop_id,stop_name,stop_lat,stop_lon\nA,Chambery,45.5658,5.9204\nB,Correspondance,45.8,6.0\nC,Saint Julien,46.1447,6.0826\n',
            'routes.txt':'route_id,route_short_name\nR1,TER1\nR2,TER2\n',
            'trips.txt':'route_id,service_id,trip_id\nR1,S,T1\nR2,S,T2\n',
            'stop_times.txt':'trip_id,arrival_time,departure_time,stop_id,stop_sequence\nT1,09:00:00,09:00:00,A,1\nT1,10:00:00,10:00:00,B,2\nT2,10:15:00,10:15:00,B,1\nT2,11:00:00,11:00:00,C,2\n',
            'calendar.txt':'service_id,monday,tuesday,wednesday,thursday,friday,saturday,sunday,start_date,end_date\nS,1,1,1,1,1,1,1,20260101,20271231\n'
          };
          const index=indexer.buildIndex(files);
          const date='2026-11-14';
          const rows=national.search({operator:'sncf',files,index,date,
            from:{lat:45.5658,lon:5.9204},to:{lat:46.1447,lon:6.0826},
            includeTransfers:true,radiusMeters:1000});
          assert.equal(rows.length,1);
          assert.equal(rows[0].legs.length,2);
          const journeys=hub.fromNationalGTFS(rows,'sncf');
          assert.equal(journeys.length,1);
          assert.equal(journeys[0].legs.length,2);
          assert.ok(journeys[0].missing.includes('correspondance GTFS non confirmée'));
          assert.equal(rows[0].priceEUR,null);
          assert.equal(hub.fromNationalGTFS([{...rows[0],transferStop:null}],'sncf').length,0,
            'Missing transfer stop must not be presented as a direct train');
          assert.equal(hub.fromNationalGTFS([{...rows[0],legs:[rows[0].legs[0]]}],'sncf').length,0,
            'Incomplete transfer legs must not become a direct train');
          const after=national.search({operator:'sncf',files,index,date,
            from:{lat:45.5658,lon:5.9204},to:{lat:46.1447,lon:6.0826},
            includeTransfers:true,radiusMeters:1000,earliestDeparture:'09:01:00'});
          assert.equal(after.length,0,'Earlier transfer must not pass departure window');
          const before=national.search({operator:'sncf',files,index,date,
            from:{lat:45.5658,lon:5.9204},to:{lat:46.1447,lon:6.0826},
            includeTransfers:true,radiusMeters:1000,latestArrival:'10:59:00'});
          assert.equal(before.length,0,'Late transfer must not pass arrival deadline');
          console.log('Two-leg national GTFS mission-card transfer and time-window filters OK');
          NODE
      - name: Vérifier les correspondances SNCF réelles dans les fiches mission
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const loader=require('./transport-gtfs-loader.js');
          const national=require('./transport-national-gtfs-journeys.js');
          const hub=require('./transport-mission-hub.js');
          const date=new Date(Date.now()+86400000).toISOString().slice(0,10);
          (async()=>{
            const bytes=fs.readFileSync('data/gtfs/national-sncf-aura.zip');
            const feed=await loader.loadResource({format:'GTFS',url:'https://example.org/sncf.zip'},{
              fetcher:async()=>new Response(bytes,{headers:{'content-type':'application/zip','content-length':String(bytes.length)}}),
              indexServiceDates:[date],retainSourceTables:false
            });
            const rows=national.search({operator:'sncf',files:feed.files,index:feed.index,date,
              from:{lat:45.5658,lon:5.9204},to:{lat:46.1447,lon:6.0826},
              radiusMeters:3000,maxResults:100,includeTransfers:true});
            const transfers=rows.filter(r=>Array.isArray(r.legs)&&r.legs.length===2);
            assert.ok(transfers.length>0,'No actual SNCF transfers found');
            const converted=hub.fromNationalGTFS(transfers,'sncf');
            assert.equal(converted.length,transfers.length);
            for(const j of converted){
              assert.equal(j.legs.length,2);
              assert.ok(j.legs.every(l=>Number.isFinite(Date.parse(l.departure))&&Number.isFinite(Date.parse(l.arrival))));
              assert.ok(Date.parse(j.legs[0].arrival)<=Date.parse(j.legs[1].departure));
              assert.ok(j.missing.includes('correspondance GTFS non confirmée'));
            }
            console.log('Real SNCF mission-card transfers validated:',converted.length,'date:',date);
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Auditer les arrêts des réseaux locaux autour de Saint-Julien et Archamps
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const loader=require('./transport-gtfs-loader.js');
          const indexer=require('./transport-gtfs-index.js');
          const networks=['tac-annemasse','cars-region-savoie','synchro-chambery',
            'tcl-lyon','cars-region-isere'];
          const points={saintJulien:{lat:46.1447,lon:6.0826},archamps:{lat:46.1362,lon:6.1328}};
          (async()=>{
            const report={scope:'regional GTFS stop proximity only; no proof of service, price or availability',radiusMeters:5000,networks:{}};
            for(const network of networks){
              const bytes=fs.readFileSync('data/gtfs/'+network+'.zip');
              const feed=await loader.loadResource({format:'GTFS',url:'https://example.org/'+network+'.zip'},{
                fetcher:async()=>new Response(bytes,{headers:{'content-type':'application/zip','content-length':String(bytes.length)}}),
                retainSourceTables:false
              });
              report.networks[network]={};
              for(const [name,p] of Object.entries(points)){
                const stops=indexer.nearbyStops(feed.index,p.lat,p.lon,5000);
                report.networks[network][name]={
                  count:stops.length,nearest:stops.slice(0,5).map(s=>({
                    name:s.name,lat:s.lat,lon:s.lon,distanceMeters:s.distanceMeters
                  }))
                };
              }
            }
            fs.writeFileSync('docs/audit-grand-geneve-local-stops.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Auditer les trajets TAC réels Saint-Julien vers Archamps
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const loader=require('./transport-gtfs-loader.js');
          const indexer=require('./transport-gtfs-index.js');
          const date=new Date(Date.now()+86400000).toISOString().slice(0,10);
          (async()=>{
            const bytes=fs.readFileSync('data/gtfs/tac-annemasse.zip');
            const feed=await loader.loadResource({format:'GTFS',url:'https://example.org/tac-annemasse.zip'},{
              fetcher:async()=>new Response(bytes,{headers:{'content-type':'application/zip','content-length':String(bytes.length)}}),
              indexServiceDates:[date],retainSourceTables:false
            });
            const from={lat:46.1447,lon:6.0826},to={lat:46.1362,lon:6.1328};
            const direct=indexer.nearbyDirectTrips(feed.files,feed.index,date,from,to,3000);
            const transfer=indexer.nearbyTransferTrips(feed.files,feed.index,date,from,to,3000,{
              maxLegs:15000,maxCandidates:200,maxExaminedPairs:30000,minTransferMinutes:5,maxWaitMinutes:120
            });
            const radii=[500,700,1200,3000];
            const byRadius=radii.map(radiusMeters=>{
              const rows=indexer.nearbyDirectTrips(feed.files,feed.index,date,from,to,radiusMeters);
              const uniqueTrips=new Set(rows.map(j=>j.tripId));
              const distinctStopPairs=new Set(rows.map(j=>j.from+'|'+j.to));
              return {radiusMeters,candidates:rows.length,uniqueTrips:uniqueTrips.size,
                distinctStopPairs:distinctStopPairs.size,
                nearestAccessMeters:rows.length?Math.min(...rows.map(j=>j.accessDistanceMeters)):null,
                nearestEgressMeters:rows.length?Math.min(...rows.map(j=>j.egressDistanceMeters)):null};
            });
            const hub=require('./transport-mission-hub.js');
            const missionCards=hub.fromGTFS(direct.map(j=>({
              ...j,network:'TAC Annemasse',
              // The hub expects ISO timestamps; preserve GTFS local clock as
              // diagnostic metadata without asserting a confirmed service.
              departure:date+'T'+j.departure+'+01:00',
              arrival:date+'T'+j.arrival+'+01:00'
            })),'TAC Annemasse');
            const uniqueDirectTrips=new Set(direct.map(j=>j.tripId)).size;
            if(missionCards.length!==uniqueDirectTrips)
              throw new Error('Mission card GTFS dedup mismatch: '+missionCards.length+' vs '+uniqueDirectTrips);
            if(missionCards.some(j=>!j.missing?.some(x=>x.includes('non confirmé en temps réel'))))
              throw new Error('Static TAC trip displayed without unconfirmed warning');
            const report={date,network:'TAC Annemasse',from:'Saint-Julien-en-Genevois',
              to:'Archamps',radiusMeters:3000,direct:direct.length,
              uniqueDirectTrips,missionCardsAfterDedup:missionCards.length,
              byRadius,oneTransfer:transfer.journeys.length,
              searchTruncated:transfer.searchTruncated,
              note:'Counts are static GTFS stop-pair candidates, not unique bookable itineraries. Straight-line stop radius is not walking distance. No verified fare, live service or pedestrian route.'};
            fs.writeFileSync('docs/audit-tac-saint-julien-archamps.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Tester la déduplication des courses GTFS locales
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const hub=require('./transport-mission-hub.js');
          const p=(name,lat,lon,distanceMeters)=>({name,lat,lon,distanceMeters});
          const common={tripId:'tac-course-1',date:'2026-11-14',line:'M',
            departure:'2026-11-14T09:00:00+01:00',arrival:'2026-11-14T09:20:00+01:00'};
          const rows=[
            {...common,originStop:p('Far',46.14,6.08,900),destinationStop:p('Far end',46.13,6.13,800),
              accessDistanceMeters:900,egressDistanceMeters:800},
            {...common,originStop:p('Near',46.14,6.08,150),destinationStop:p('Near end',46.13,6.13,180),
              accessDistanceMeters:150,egressDistanceMeters:180},
            {...common,tripId:'tac-course-2',departure:'2026-11-14T10:00:00+01:00',
              arrival:'2026-11-14T10:20:00+01:00',originStop:p('Other',46.14,6.08,250),
              destinationStop:p('Other end',46.13,6.13,260),accessDistanceMeters:250,egressDistanceMeters:260}
          ];
          const journeys=hub.fromGTFS(rows,'TAC');
          assert.equal(journeys.length,2,'Two distinct vehicle trips must remain');
          assert(journeys.every(j=>j.missing.some(x=>x.includes('non confirmé en temps réel'))),
            'Static GTFS must never be mistaken for a confirmed live bus');
          const task={from:{lat:46.14,lon:6.08},to:{lat:46.13,lon:6.13}};
          assert.equal(hub.assess(journeys[0],task,null).feasible,false,
