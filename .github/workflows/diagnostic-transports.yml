            'HH:MM and HH:MM:SS must resolve to the same instant');
          assert.equal(hub.fromNationalGTFS([nationalRow],'flixbus').length,0);
          const stop={lat:45.901,lon:6.121};
          const arrival={lat:45.761,lon:4.861};
          const journey={source:'national-gtfs',missing:['horaire GTFS non confirmé en temps réel'],
            legs:[{kind:'transit',mode:'Train',line:'TER',fromPoint:stop,toPoint:arrival,
