name: Test mobile transport lifecycle
on:
  push:
    branches: [feature/transport-ranking-safe]
    paths: ['server/**', '*.js', 'index.html', 'style.css', 'tests/browser/**', 'tests/fixtures/**', '.github/workflows/test-transport-mobile.yml']
  pull_request:
    paths: ['server/**', '*.js', 'index.html', 'style.css', 'tests/browser/**', 'tests/fixtures/**', '.github/workflows/test-transport-mobile.yml']
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-1.62.1-${{ runner.os }}
      - run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 12
      - run: node tests/browser/transport-mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-mobile-browser
          path: tmp/transport-browser
          retention-days: 7
