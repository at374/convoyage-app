name: Test national GTFS builder
on:
  push:
    paths:
      - 'scripts/*national*py'
      - 'scripts/build_regional_gtfs.py'
      - '.github/workflows/test-national-gtfs-builder.yml'
  pull_request:
    paths:
      - 'scripts/*national*py'
      - 'scripts/build_regional_gtfs.py'
      - '.github/workflows/test-national-gtfs-builder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_national_gtfs_aura.py
      - run: python3 scripts/test_national_catalogue_builder.py
