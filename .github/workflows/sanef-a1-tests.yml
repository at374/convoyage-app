name: SANEF A1 read-only checks
on:
  push:
    branches:
      - feature/transport-ranking-safe
    paths:
      - 'sanef-a1-*.js'
      - 'sanef-a1-*.json'
      - 'test-sanef-a1-*.cjs'
      - 'run-sanef-a1-tests.cjs'
      - 'peages-overlay.json'
      - '.github/workflows/sanef-a1-tests.yml'
  pull_request:
    paths:
      - 'sanef-a1-*.js'
      - 'sanef-a1-*.json'
      - 'test-sanef-a1-*.cjs'
      - 'run-sanef-a1-tests.cjs'
      - 'peages-overlay.json'
      - '.github/workflows/sanef-a1-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SANEF A1 regression suites
        run: node run-sanef-a1-tests.cjs
