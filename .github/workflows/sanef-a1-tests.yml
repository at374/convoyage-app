name: SANEF A1 read-only checks
on:
  workflow_dispatch:
  push:
    branches:
      - feature/transport-ranking-safe
    paths:
      - 'sanef-a1-*.js'
      - 'sanef-a1-*.json'
      - 'test-sanef-a1-*.cjs'
      - 'run-sanef-a1-tests.cjs'
      - 'peages-overlay.json'
      - 'peages-france-relations-zero-a-auditer-2026.csv'
      - 'test-peages-france-inventaire-2026.cjs'
      - 'sanef-a1-certification-relations-2026.csv'
      - 'sanef-a1-audit-alias-gares-2026.csv'
      - 'routes-ui.js'
      - 'index.html'
      - 'sanef-a1-preview-lab.html'
      - '.github/workflows/sanef-a1-tests.yml'
  pull_request:
    paths:
      - 'sanef-a1-*.js'
      - 'sanef-a1-*.json'
      - 'test-sanef-a1-*.cjs'
      - 'run-sanef-a1-tests.cjs'
      - 'peages-overlay.json'
      - 'sanef-a1-certification-relations-2026.csv'
      - 'sanef-a1-audit-alias-gares-2026.csv'
      - 'routes-ui.js'
      - 'index.html'
      - 'sanef-a1-preview-lab.html'
      - '.github/workflows/sanef-a1-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SANEF A1 regression suites
        run: |
          node run-sanef-a1-tests.cjs
          node test-peages-france-inventaire-2026.cjs
