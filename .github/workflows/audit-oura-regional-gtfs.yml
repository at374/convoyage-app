name: Audit regional GTFS Oura
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check official Oura aggregate metadata and GTFS archive
        shell: python
        run: |
          import json, urllib.request, zipfile, tempfile, os, datetime, csv, io
          api = 'https://www.data.gouv.fr/api/1/datasets/?q=agr%C3%A9gat%20O%C3%B9ra&page_size=30'
          req = urllib.request.Request(api, headers={'User-Agent':'ConvoyageUltra-GTFS-Audit/1.0'})
          with urllib.request.urlopen(req, timeout=35) as response:
              data = json.load(response)
          datasets = [d for d in data.get('data', []) if 'oura' in
                      __import__('unicodedata').normalize('NFKD', d.get('title','')).encode('ascii','ignore').decode().lower()]
          if not datasets:
              raise SystemExit('Official Oura dataset not found')
          resources = [r for d in datasets for r in d.get('resources', [])
                       if 'gtfs' in (r.get('format') or '').lower() and r.get('url','').startswith('https://')]
          if not resources:
              raise SystemExit('No HTTPS GTFS resource listed')
          resource = max(resources, key=lambda r:r.get('last_modified') or '')
          url = resource['url']
          req = urllib.request.Request(url, headers={'User-Agent':'ConvoyageUltra-GTFS-Audit/1.0'})
          with urllib.request.urlopen(req, timeout=90) as response, tempfile.NamedTemporaryFile(delete=False) as tmp:
              while True:
                  chunk = response.read(1024*1024)
                  if not chunk: break
                  tmp.write(chunk)
                  if tmp.tell() > 400*1024*1024:
                      raise SystemExit('Archive exceeds safe size')
              archive = tmp.name
          try:
              with zipfile.ZipFile(archive) as z:
                  names = set(z.namelist())
                  required = {'stops.txt','trips.txt','stop_times.txt','routes.txt'}
                  missing = required - names
                  if missing: raise SystemExit('Missing GTFS tables: '+str(sorted(missing)))
                  if not ({'calendar.txt', 'calendar_dates.txt'} & names):
                      raise SystemExit('No GTFS service calendar')
                  def rows(table):
                      if table not in names: return
                      with z.open(table) as stream:
                          for row in csv.DictReader(io.TextIOWrapper(stream, encoding='utf-8-sig')):
                              yield row
                  agencies = {r.get('agency_id') or r.get('agency_name') for r in rows('agency.txt')}
                  routes = list(rows('routes.txt'))
                  route_ids = {r.get('route_id') for r in routes}
                  route_types = {}
                  for route in routes:
                      kind = route.get('route_type', 'unknown')
                      route_types[kind] = route_types.get(kind, 0) + 1
                  stop_ids = {r.get('stop_id') for r in rows('stops.txt')}
                  trip_ids = set()
                  service_ids = set()
                  unknown_trip_routes = 0
                  for trip in rows('trips.txt'):
                      trip_ids.add(trip.get('trip_id'))
                      service_ids.add(trip.get('service_id'))
                      if trip.get('route_id') not in route_ids:
                          unknown_trip_routes += 1
                  calendar_ids = {r.get('service_id') for r in rows('calendar.txt')}
                  calendar_ids.update(r.get('service_id') for r in rows('calendar_dates.txt'))
                  unknown_services = len(service_ids - calendar_ids)
                  stop_time_count = 0
                  unknown_stop_references = 0
                  unknown_trip_references = 0
                  for stop_time in rows('stop_times.txt'):
                      stop_time_count += 1
                      unknown_stop_references += stop_time.get('stop_id') not in stop_ids
                      unknown_trip_references += stop_time.get('trip_id') not in trip_ids
                  stop_count = len(stop_ids)
                  trip_count = len(trip_ids)
                  if not route_ids or not stop_count or not trip_count or not stop_time_count:
                      raise SystemExit('GTFS has empty route/stop/trip/stop_time tables')
                  if unknown_trip_routes or unknown_services or unknown_stop_references or unknown_trip_references:
                      raise SystemExit('GTFS referential integrity failed: ' + str({
                        'unknown_trip_routes':unknown_trip_routes,
                        'unknown_services':unknown_services,
                        'unknown_stop_references':unknown_stop_references,
                        'unknown_trip_references':unknown_trip_references}))
                  summary = {'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'source':url,'archive_bytes':os.path.getsize(archive),
                    'agency_count':len(agencies),'route_count':len(route_ids),
                    'stop_count':stop_count,'trip_count':trip_count,
                    'stop_time_count':stop_time_count,'service_count':len(service_ids),
                    'route_types':route_types,'source_updated_at':resource.get('last_modified'),
                    'status':'GTFS_ARCHIVE_VALIDATED'}
                  with open('oura-audit.json','w',encoding='utf-8') as out:
                      json.dump(summary,out,ensure_ascii=False,indent=2)
                  print(json.dumps(summary,ensure_ascii=False,indent=2))
                  print(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'source':url,'archive_bytes':os.path.getsize(archive),
                    'tables':sorted(names),'status':'GTFS_ARCHIVE_VALIDATED'},
                    ensure_ascii=False,indent=2))
                  # Move only after all archive-dependent checks and logging.
                  # Keep the validated feed as a CI artifact, not in the mobile app.
                  os.replace(archive, 'oura-regional.gtfs.zip')
          finally:
              if os.path.exists(archive):
                  os.unlink(archive)
      - name: Upload regional coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oura-regional-gtfs-audit
          path: oura-audit.json
          if-no-files-found: warn
      - name: Upload validated regional GTFS for routing-engine build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oura-regional-gtfs-validated
          path: oura-regional.gtfs.zip
          retention-days: 7
          if-no-files-found: error
