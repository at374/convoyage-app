name: SIBRA GTFS export validation

on:
  push:
    paths:
      - 'scripts/export_sibra_day.py'
      - 'scripts/export_sibra_range.py'
      - 'tests/test_sibra_export.py'
      - '.github/workflows/sibra-gtfs-tests.yml'
  pull_request:
    paths:
      - 'scripts/export_sibra_day.py'
      - 'scripts/export_sibra_range.py'
      - 'tests/test_sibra_export.py'
      - '.github/workflows/sibra-gtfs-tests.yml'
  workflow_dispatch:

jobs:
  gtfs-export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/export_sibra_day.py scripts/export_sibra_range.py tests/test_sibra_export.py
      - name: Run SIBRA GTFS regression tests
        run: python -m unittest discover -s tests -p 'test_sibra_export.py' -v
