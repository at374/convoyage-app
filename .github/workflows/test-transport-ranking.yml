permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check transport-blablacar-realtime.js
      - run: node --test tests/transport-realtime-relay.test.cjs
      - run: node --test tests/geo-country-detection.test.cjs
      - run: node --test tests/transport-272-fares.test.cjs
      - run: node --test tests/transport-aravis-fares.test.cjs
      - run: node --test tests/transport-y21-fares.test.cjs
      - run: node --test tests/transport-y22-fares.test.cjs
      - run: node --test tests/transport-y02-fares.test.cjs
      - run: node --check transport-ranking.js
      - run: node --check transport-adapters.js
      - run: node --check transport-fares.js
      - run: node --check transport-sibra-pass.js
      - run: node --check transport-cars-region-fares.js
      - run: node --test tests/transport-cars-region-fares.test.cjs
      - run: node --check transport-y51-fares.js
      - run: node --check transport-catalogue.js
      - run: node --check transport-swiss-ain.js
      - run: node --check transport-gtfs-index.js
      - run: node --check transport-gtfs-loader.js
      - run: node --check transport-gtfs-worker.js
      - run: node --check transport-gtfs-federation.js
      - run: node --check transport-gtfs-agenda.js
      - run: node --check transport-walking.js
      - run: node --check transport-gtfs-time.js
      - run: node --check transport-gtfs-worker-client.js
      - run: node tests/transport-ranking.test.cjs
      - run: node --test tests/transport-map.test.cjs
      - run: node --test tests/transport-ranking-main-port.test.js
      - run: node tests/transport-adapters.test.cjs
      - run: node tests/transport-fares.test.cjs
      - run: node --test tests/transport-sibra-pass.test.cjs
      - run: node --test tests/transport-y51-fares.test.cjs
      - run: node tests/transport-catalogue.test.cjs
      - run: node tests/transport-swiss-ain.test.cjs
      - run: node tests/transport-gtfs-index.test.cjs
      - run: node --test tests/transport-gtfs-loader.test.cjs
      - run: node --test tests/transport-gtfs-worker.test.cjs
      - run: node --test tests/transport-gtfs-nearby.test.cjs
      - run: node --test tests/transport-gtfs-time.test.cjs
      - run: node --test tests/transport-gtfs-agenda.test.cjs
      - run: node --test tests/transport-gtfs-transfers.test.cjs
      - run: node --test tests/transport-gtfs-federation.test.cjs
      - run: node --test tests/transport-walking.test.cjs
