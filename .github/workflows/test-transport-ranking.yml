name: Test transport ranking
on:
  push:
    branches: [feature/transport-ranking-safe]
    paths:
      - 'transport-ranking.js'
      - 'transport-adapters.js'
      - 'transport-fares.js'
      - 'transport-catalogue.js'
      - 'transport-gtfs-index.js'
      - 'transport-gtfs-loader.js'
      - 'transport-gtfs-worker.js'
      - 'transport-gtfs-time.js'
      - 'transport-gtfs-worker-client.js'
      - 'tests/transport-ranking.test.cjs'
      - 'tests/transport-adapters.test.cjs'
      - 'tests/transport-fares.test.cjs'
      - 'tests/transport-catalogue.test.cjs'
      - 'tests/transport-gtfs-index.test.cjs'
      - 'tests/transport-gtfs-nearby.test.cjs'
      - 'tests/transport-gtfs-loader.test.cjs'
      - 'tests/transport-gtfs-worker.test.cjs'
      - 'tests/transport-gtfs-time.test.cjs'
      - '.github/workflows/test-transport-ranking.yml'
  pull_request:
    paths:
      - 'transport-ranking.js'
      - 'transport-adapters.js'
      - 'transport-fares.js'
      - 'transport-catalogue.js'
      - 'transport-gtfs-index.js'
      - 'transport-gtfs-loader.js'
      - 'transport-gtfs-worker.js'
      - 'transport-gtfs-time.js'
      - 'transport-gtfs-worker-client.js'
      - 'tests/transport-ranking.test.cjs'
      - 'tests/transport-adapters.test.cjs'
      - 'tests/transport-fares.test.cjs'
      - 'tests/transport-catalogue.test.cjs'
      - 'tests/transport-gtfs-index.test.cjs'
      - 'tests/transport-gtfs-nearby.test.cjs'
      - 'tests/transport-gtfs-loader.test.cjs'
      - 'tests/transport-gtfs-worker.test.cjs'
      - 'tests/transport-gtfs-time.test.cjs'
      - '.github/workflows/test-transport-ranking.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check transport-ranking.js
      - run: node --check transport-adapters.js
      - run: node --check transport-fares.js
      - run: node --check transport-catalogue.js
      - run: node --check transport-gtfs-index.js
      - run: node --check transport-gtfs-loader.js
      - run: node --check transport-gtfs-worker.js
      - run: node --check transport-gtfs-time.js
      - run: node --check transport-gtfs-worker-client.js
      - run: node tests/transport-ranking.test.cjs
      - run: node tests/transport-adapters.test.cjs
      - run: node tests/transport-fares.test.cjs
      - run: node tests/transport-catalogue.test.cjs
      - run: node tests/transport-gtfs-index.test.cjs
      - run: node --test tests/transport-gtfs-loader.test.cjs
      - run: node --test tests/transport-gtfs-worker.test.cjs
      - run: node --test tests/transport-gtfs-nearby.test.cjs
      - run: node --test tests/transport-gtfs-time.test.cjs
