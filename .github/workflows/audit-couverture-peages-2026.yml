name: Audit couverture peages 2026
on:
  workflow_dispatch:
  push:
    branches:
      - feature/transport-ranking-safe
    paths:
      - scripts/audit-couverture-peages-2026.cjs
      - scripts/peages-sapn-a14-2026.cjs
      - .github/workflows/audit-couverture-peages-2026.yml
      - tests/peages-audit-couverture-2026.test.cjs
      - tests/peages-sapn-beuzeville-2026.test.cjs tests/peages-sapn-a14-conditions-2026.test.cjs
      - tests/peages-sapn-a14-conditions-2026.test.cjs
      - peages-aprr.json
      - peages-overlay.json
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester les comptages et le pourcentage historique
        run: node --test tests/peages-audit-couverture-2026.test.cjs tests/peages-sapn-beuzeville-2026.test.cjs
      - name: Calculer inventaire sans modifier les prix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-couverture-peages-2026.cjs | tee audit-couverture-peages-2026.json
          node -e "const r=require('./audit-couverture-peages-2026.json'); if(r.coverage.remaining_national_percentage!==null) throw Error('Pourcentage national non certifie'); const b=r.base; require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '# Audit péages 2026\\n\\n| Mesure | Valeur |\\n|---|---:|\\n| Relations uniques non orientées | '+b.relations_uniques_non_orientees+' |\\n| Montants classes 1/2 | '+b.montants_classes_1_2+' |\\n| Lignes malformées | '+b.lignes_malformees+' |\\n| Doublons divergents | '+b.doublons_prix_divergents+' |\\n\\n**Pourcentage national restant : non certifié.**\\n');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-couverture-peages-2026
          path: audit-couverture-peages-2026.json
          if-no-files-found: error
