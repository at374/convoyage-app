name: Construire GTFS nationaux AURA (manuel)
on:
  push:
    branches: [feature/transports-aura-suisse]
    paths:
      - '.github/workflows/build-national-gtfs-aura.yml'
      - 'scripts/build_national_from_catalogue.py'
  workflow_dispatch:
    inputs:
      operator:
        description: 'Opérateur à vérifier (all = les trois)'
        required: true
        default: all
        type: choice
        options:
          - all
          - sncf
          - blablacarBus
          - flixbus

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Découvrir les flux nationaux officiels
        continue-on-error: true
        run: node scripts/audit-national-operators.cjs
      - name: Préparer les extraits AURA depuis les flux disponibles
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ inputs.operator || 'all' }}" = all ]; then
            python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --out data/gtfs | tee national-build-report.json
          else
            python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --out data/gtfs --operator "${{ inputs.operator || 'all' }}" | tee national-build-report.json
          fi
      - name: Publier les extraits officiels sur la branche transports (sans déploiement Android)
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/feature/transports-aura-suisse'
        shell: bash
        run: |
          set -euo pipefail
          test -s data/gtfs/national-sncf-aura.zip
          test -s data/gtfs/national-blablacarBus-aura.zip
          test -s data/gtfs/national-flixbus-aura.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gtfs/national-*-aura.zip data/gtfs/national-*-aura.zip.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official national AURA GTFS slices (no commercial fares)"
            git push origin HEAD:feature/transports-aura-suisse
          fi
      - name: Conserver le rapport et les extraits sans déploiement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-aura-gtfs-${{ github.run_id }}
          path: |
            docs/audit-national-operators.json
            national-build-report.json
            data/gtfs/national-*.zip
            data/gtfs/national-*.zip.json
          if-no-files-found: warn
          retention-days: 7
      - name: Signaler les opérateurs indisponibles
        if: steps.build.outcome != 'success'
        run: |
          echo 'Certains flux nationaux sont absents ou non exploitables : consulter le rapport, aucun tarif inventé.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
