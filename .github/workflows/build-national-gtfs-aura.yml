name: Construire les extraits GTFS des opérateurs nationaux
on:
  schedule:
    - cron: '17 3 * * 2'   # chaque mardi : SNCF, FlixBus, BlaBlaCar Bus (extraits AURA) restent à jour
  push:
    branches: [feature/transports-aura-suisse]
    paths:
      - '.github/workflows/build-national-gtfs-aura.yml'
      - 'scripts/build_national_from_catalogue.py'
      - 'scripts/build_national_gtfs_aura.py'
  workflow_dispatch:
    inputs:
      operator:
        description: 'Opérateur à vérifier (all = les trois)'
        required: true
        default: all
        type: choice
        options:
          - all
          - sncf
          - blablacarBus
          - flixbus

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Découvrir les flux nationaux officiels
        continue-on-error: true
        run: node scripts/audit-national-operators.cjs
      - name: Préparer les extraits AURA depuis les flux disponibles
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ inputs.operator || 'all' }}" = all ]; then
            python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --out data/gtfs | tee national-build-report.json
          else
            python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --out data/gtfs --operator "${{ inputs.operator || 'all' }}" | tee national-build-report.json
          fi
      - name: Actualiser Paris–Lyon sur la branche publiée
        id: paris_lyon
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          OPERATOR: ${{ inputs.operator || 'all' }}
        run: |
          set -o pipefail
          args=()
          if [ "$OPERATOR" != all ]; then args+=(--operator "$OPERATOR"); fi
          python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --region paris-lyon --out data/gtfs "${args[@]}" | tee national-paris-lyon-report.json
      - name: Actualiser Lyon–Marseille sur la branche publiée
        id: lyon_marseille
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          OPERATOR: ${{ inputs.operator || 'all' }}
        run: |
          set -o pipefail
          args=()
          if [ "$OPERATOR" != all ]; then args+=(--operator "$OPERATOR"); fi
          python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --region lyon-marseille --out data/gtfs "${args[@]}" | tee national-lyon-marseille-report.json
      - name: Actualiser Paris–Marseille sur la branche publiée
        id: paris_marseille
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          OPERATOR: ${{ inputs.operator || 'all' }}
        run: |
          set -o pipefail
          args=()
          if [ "$OPERATOR" != all ]; then args+=(--operator "$OPERATOR"); fi
          python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --region paris-marseille --out data/gtfs "${args[@]}" | tee national-paris-marseille-report.json
      - name: Actualiser Marseille–Toulouse sur la branche publiée
        id: marseille_toulouse
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          OPERATOR: ${{ inputs.operator || 'all' }}
        run: |
          set -o pipefail
          args=()
          if [ "$OPERATOR" != all ]; then args+=(--operator "$OPERATOR"); fi
          python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --region marseille-toulouse --out data/gtfs "${args[@]}" | tee national-marseille-toulouse-report.json
      - name: Actualiser Toulouse–Bordeaux sur la branche publiée
        id: toulouse_bordeaux
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          OPERATOR: ${{ inputs.operator || 'all' }}
        run: |
          set -o pipefail
          args=()
          if [ "$OPERATOR" != all ]; then args+=(--operator "$OPERATOR"); fi
          python3 scripts/build_national_from_catalogue.py --audit docs/audit-national-operators.json --region toulouse-bordeaux --out data/gtfs "${args[@]}" | tee national-toulouse-bordeaux-report.json
      - name: Publier les extraits officiels sur la branche transports (sans déploiement Android)
        if: (steps.build.outcome == 'success' || steps.paris_lyon.outcome == 'success' || steps.lyon_marseille.outcome == 'success' || steps.paris_marseille.outcome == 'success' || steps.marseille_toulouse.outcome == 'success' || steps.toulouse_bordeaux.outcome == 'success') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/transports-aura-suisse')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AURA_BUILD: ${{ steps.build.outcome }}
          LYON_MARSEILLE_BUILD: ${{ steps.lyon_marseille.outcome }}
          MARSEILLE_TOULOUSE_BUILD: ${{ steps.marseille_toulouse.outcome }}
          TOULOUSE_BORDEAUX_BUILD: ${{ steps.toulouse_bordeaux.outcome }}
          PARIS_MARSEILLE_BUILD: ${{ steps.paris_marseille.outcome }}
          PARIS_LYON_BUILD: ${{ steps.paris_lyon.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$AURA_BUILD" = success ]; then
            git add data/gtfs/national-*-aura.zip data/gtfs/national-*-aura.zip.json
          fi
          if [ "$PARIS_LYON_BUILD" = success ]; then
            git add data/gtfs/national-*-paris-lyon.zip data/gtfs/national-*-paris-lyon.zip.json
          fi
          if [ "$LYON_MARSEILLE_BUILD" = success ]; then
            git add data/gtfs/national-*-lyon-marseille.zip data/gtfs/national-*-lyon-marseille.zip.json
          fi
          if [ "$PARIS_MARSEILLE_BUILD" = success ]; then
            git add data/gtfs/national-*-paris-marseille.zip data/gtfs/national-*-paris-marseille.zip.json
          fi
          if [ "$MARSEILLE_TOULOUSE_BUILD" = success ]; then
            git add data/gtfs/national-*-marseille-toulouse.zip data/gtfs/national-*-marseille-toulouse.zip.json
          fi
          if [ "$TOULOUSE_BORDEAUX_BUILD" = success ]; then
            git add data/gtfs/national-*-toulouse-bordeaux.zip data/gtfs/national-*-toulouse-bordeaux.zip.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update official national GTFS slices (no commercial fares)"
            # Other transport diagnostics may commit while the feed is downloading.
            # Replay this data-only commit on the latest remote tip; never force-push.
            for essai in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              [ "$essai" = 3 ] && exit 1
              sleep 5
            done
            if [ "${GITHUB_REF_NAME}" = "main" ]; then gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true; fi
          fi
      - name: Conserver le rapport et les extraits sans déploiement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-aura-gtfs-${{ github.run_id }}
          path: |
            docs/audit-national-operators.json
            national-build-report.json
            national-paris-lyon-report.json
            national-lyon-marseille-report.json
            national-paris-marseille-report.json
            national-marseille-toulouse-report.json
            national-toulouse-bordeaux-report.json
            data/gtfs/national-*.zip
            data/gtfs/national-*.zip.json
          if-no-files-found: warn
          retention-days: 7
      - name: Signaler les opérateurs indisponibles
        if: steps.build.outcome != 'success' || steps.paris_lyon.outcome == 'failure' || steps.lyon_marseille.outcome == 'failure' || steps.paris_marseille.outcome == 'failure' || steps.marseille_toulouse.outcome == 'failure' || steps.toulouse_bordeaux.outcome == 'failure'
        run: |
          echo 'Certains flux nationaux sont absents ou non exploitables : consulter le rapport, aucun tarif inventé.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
