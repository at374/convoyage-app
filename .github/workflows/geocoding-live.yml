name: Live IGN geocoding verification
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/transports-aura-suisse"]
    paths:
      - 'geo.js'
      - 'tests/geo-adresse-repli.test.cjs'
      - 'tests/platform-address-normalization.test.cjs'
      - 'tests/transport-geocode-missing.test.cjs'
      - 'app.js'
      - 'server/hiflow-sync-deploy/hiflow-vendor/sync-core.js'
      - 'server/driiveme-sync-deploy/driiveme-vendor/sync-core.js'
      - '.github/workflows/geocoding-live.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run platform address normalization tests
        run: node --test tests/platform-address-normalization.test.cjs
      - name: Run address geocoding regression tests
        run: |
          node --test tests/geo-adresse-repli.test.cjs
          node --test tests/transport-geocode-missing.test.cjs
      - name: Query official geocoder
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, unicodedata, re
          def norm(s):
              s = unicodedata.normalize('NFKD', s.lower())
              return re.sub(r'[^a-z0-9]+', ' ', ''.join(c for c in s if not unicodedata.combining(c))).strip()
          url = 'https://data.geopf.fr/geocodage/search?' + urllib.parse.urlencode({'q': "94 avenue d'Aix-les-Bains Annecy", 'limit': 5})
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)
          matches = []
          street_matches = []
          def is_exact_94(p):
              return p.get('type') == 'housenumber' and str(p.get('housenumber')) == '94' and 'aix' in norm(p.get('street', '')) and 'bains' in norm(p.get('street', '')) and p.get('citycode') == '74010'
          def is_avenue_fallback(p):
              return p.get('type') == 'street' and norm(p.get('street', p.get('name', ''))) == 'avenue d aix les bains' and p.get('citycode') == '74010'
          for f in data['features']:
              p = f['properties']
              print(json.dumps({'properties': p, 'coordinates': f['geometry']['coordinates']}, ensure_ascii=False))
              if is_exact_94(p):
                  matches.append(f)
              if is_avenue_fallback(p):
                  street_matches.append(f)
          if not matches:
              for query in ["94 avenue d'Aix-les-Bains 74600 Annecy", "94 avenue aix les bains Seynod", "94 avenue d'Aix-les-Bains 74600 Seynod"]:
                  url = 'https://data.geopf.fr/geocodage/search?' + urllib.parse.urlencode({'q': query, 'limit': 10, 'type': 'housenumber'})
                  print('Query:', query)
                  with urllib.request.urlopen(url, timeout=20) as response:
                      for f in json.load(response)['features']:
                          p = f['properties']
                          print(json.dumps({'properties': p, 'coordinates': f['geometry']['coordinates']}, ensure_ascii=False))
                          if is_exact_94(p):
                              matches.append(f)
          assert matches or street_matches, 'No verified house number or street fallback for 94 avenue d’Aix-les-Bains'
          print('94 avenue d’Aix-les-Bains precision:', 'adresse' if matches else 'rue')
          def features_for(query, kind=None):
              params = {'q': query, 'limit': 10}
              if kind:
                  params['type'] = kind
              url = 'https://data.geopf.fr/geocodage/search?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=20) as response:
                  return json.load(response)['features']
          for query, number, street, citycode, label in [
              ("25 faubourg des Balmettes Annecy", "25", "faubourg des balmettes", "74010", "25 faubourg des Balmettes, Annecy"),
              ("94 avenue d'Aix-les-Bains Annecy", "94", "avenue d aix les bains", "74010", "94 avenue d'Aix-les-Bains, Annecy"),
          ]:
              candidates = features_for(query) + features_for(street + " Annecy", "street")
              for f in candidates:
                  print(label + ':', json.dumps({'properties': f['properties'], 'coordinates': f['geometry']['coordinates']}, ensure_ascii=False))
              exact = any(f['properties'].get('type') == 'housenumber' and str(f['properties'].get('housenumber')) == number and street in norm(f['properties'].get('street', '')) and f['properties'].get('citycode') == citycode for f in candidates)
              street_only = any(f['properties'].get('type') == 'street' and street in norm(f['properties'].get('street', f['properties'].get('name', ''))) and f['properties'].get('citycode') == citycode for f in candidates)
              assert exact or street_only, 'No exact address or verified street fallback for ' + label
          candidates = features_for("Rue Louis Armand Voiron", "street")
          for f in candidates:
              print('Rue Louis Armand, Voiron:', json.dumps({'properties': f['properties'], 'coordinates': f['geometry']['coordinates']}, ensure_ascii=False))
          assert any(f['properties'].get('type') == 'street' and f['properties'].get('citycode') == '38563' and 'louis armand' in norm(f['properties'].get('name', f['properties'].get('street', ''))) for f in candidates), 'No verified street result for Rue Louis Armand, Voiron'
          PY
