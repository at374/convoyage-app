name: Test regional transport adapter
on:
  push:
    paths:
      - 'regional-routing.js'
      - 'app.js'
      - 'tests/regional-routing.test.cjs'
      - 'tests/transport-regional-agenda.test.cjs'
      - 'tests/fixtures/mobilites-m-grenoble-crolles-2026-10-30.json'
      - '.github/workflows/test-regional-routing.yml'
  pull_request:
    paths:
      - 'regional-routing.js'
      - 'app.js'
      - 'tests/regional-routing.test.cjs'
      - 'tests/transport-regional-agenda.test.cjs'
      - 'tests/fixtures/mobilites-m-grenoble-crolles-2026-10-30.json'
      - '.github/workflows/test-regional-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check regional-routing.js
          node --check tests/regional-routing.test.cjs
      - name: Run regional routing unit tests
        run: node --test tests/regional-routing.test.cjs tests/transport-regional-agenda.test.cjs
