name: Build regional GTFS (Oùra extracts + official mirrors)
# Prépare data/gtfs : J'y bus, TAM, Cars Région Isère/Savoie (extraits de l'agrégat officiel Oùra)
# et copies validées des flux TAC, Synchro, Ondéa, Star't, servies par le site (pas de blocage CORS).
on:
  workflow_dispatch:
  push:
    branches: [main, feature/transports-aura-suisse]
    paths:
      - '.github/workflows/build-regional-gtfs.yml'
      - 'scripts/build_regional_gtfs.py'
      - 'tests/mobigo-bfc-real-slices.test.cjs'
      - 'tests/optymo-gtfs-access.test.cjs'
      - 'tests/fluo-grand-est-real-feed.test.cjs'
      - 'tests/solea-mulhouse-real-feed.test.cjs'
      - 'tests/stan-nancy-real-feed.test.cjs'
      - 'tests/grand-reims-real-feed.test.cjs'
      - 'tests/grand-est-urban-real-feeds.test.cjs'
      - 'tests/forbus-real-feed.test.cjs'
      - 'tests/temob-real-feed.test.cjs'
      - 'tests/hauts-de-france-urban-real-feeds.test.cjs'
      - 'tests/normandie-real-agency-feeds.test.cjs'
      - 'tests/centre-val-de-loire-real-feeds.test.cjs'
      - 'tests/paca-zou-proximity-real-feed.test.cjs'
      - 'tests/occitanie-lio-real-feed.test.cjs'
      - 'tests/occitanie-urban-real-feeds.test.cjs'
      - 'transport-mission-hub.js'
  schedule:
    - cron: '41 2 * * 1'   # chaque lundi (consommation GitHub Actions : quelques minutes par semaine)
permissions:
  contents: write
  pages: write
concurrency:
  group: regional-gtfs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests hors ligne du script
        run: python3 -I tests/python/test_build_regional_gtfs.py
      - name: Télécharger, extraire et valider
        run: python3 -I scripts/build_regional_gtfs.py --out data/gtfs
      - name: Vérifier les trajets réels de BFC dans le moteur de mission
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/mobigo-bfc-real-slices.test.cjs
      - name: Vérifier les règles de montée Optymo avant raccordement
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/optymo-gtfs-access.test.cjs
      - name: Vérifier les horaires actifs Fluo Grand Est dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/fluo-grand-est-real-feed.test.cjs
      - name: Vérifier les horaires actifs Soléa dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/solea-mulhouse-real-feed.test.cjs
      - name: Vérifier les horaires actifs STAN dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/stan-nancy-real-feed.test.cjs
      - name: Vérifier les horaires actifs Grand Reims dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/grand-reims-real-feed.test.cjs
      - name: Vérifier les flux urbains Grand Est dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/grand-est-urban-real-feeds.test.cjs
      - name: Vérifier Forbus sans sa ligne transfrontalière dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/forbus-real-feed.test.cjs
      - name: Vérifier TeMo’b sans sa ligne transfrontalière dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/temob-real-feed.test.cjs
      - name: Vérifier les réseaux urbains Hauts-de-France dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/hauts-de-france-urban-real-feeds.test.cjs
      - name: Vérifier les 28 réseaux de Normandie dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/normandie-real-agency-feeds.test.cjs
      - name: Vérifier les 19 réseaux JVMALIN dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/centre-val-de-loire-real-feeds.test.cjs
      - name: Vérifier les horaires ZOU Proximité PACA dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/paca-zou-proximity-real-feed.test.cjs
      - name: Vérifier les fragments et horaires liO Occitanie dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/occitanie-lio-real-feed.test.cjs
      - name: Vérifier Tisséo, TaM et Tango dans l’indexeur GTFS
        env:
          REQUIRE_REAL_GTFS: '1'
        run: node --test tests/occitanie-urban-real-feeds.test.cjs
      - name: Publier les flux validés
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/gtfs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh regional GTFS extracts and mirrors'
          # Les commits de code peuvent arriver pendant les téléchargements. Rejoue le commit
          # de données sur la tête courante, sans push forcé ni écrasement des changements concurrents.
          for attempt in 1 2 3; do
            git fetch --no-tags origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Publication refusée après trois tentatives de synchronisation' >&2
              exit 1
            fi
            echo "La branche a encore avancé ; nouvelle tentative $((attempt + 1))/3"
          done
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true; fi
